<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Retro Iso-Soccer Engine Simulator</title>
        <link rel="icon" href="favicon.ico">
        <script>
            // Relative "html/" treats a no-slash URL as a file: /soccer-js + html/ → /html/.
            // Keep the last segment as a directory; also handle /index.html.
            const path = location.pathname.replace(/\/index\.html$/i, '/');
            const dir = path.endsWith('/') ? path : path + '/';
            window.location.replace(dir + 'html/' + location.search + location.hash);
        </script>
    </head>
    <body>
        Redirecting...
    </body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Jornada 90</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #f4f4f4;
      font-family: system-ui, -apple-system, sans-serif;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      display: flex;
      flex-direction: column;
    }

    #app {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
    }

    .header {
      text-align: center;
      padding: 20px 12px;
      background: #090909;
      border-bottom: 1px solid #202020;
    }

    .brand {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .brand b {
      color: #ffca3a;
    }

    .tagline {
      font-size: 12px;
      color: #8a8a8a;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 12px;
      background: #090909;
    }

    .stat-card {
      background: #1a1a1a;
      border: 1px solid #202020;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      will-change: transform;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: #ffca3a;
      display: block;
    }

    .stat-label {
      font-size: 11px;
      color: #8a8a8a;
      margin-top: 4px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 12px;
      flex: 1;
      align-content: start;
    }

    .btn {
      background: #1a1a1a;
      border: 1px solid #202020;
      color: #f4f4f4;
      padding: 16px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      touch-action: manipulation;
      cursor: pointer;
      transition: none;
      position: relative;
      overflow: hidden;
    }

    .btn:active {
      background: #242424;
      border-color: #42d77d;
      transform: scale(0.98);
    }

    .btn-value {
      display: block;
      font-size: 11px;
      font-weight: 400;
      color: #8a8a8a;
      margin-top: 6px;
    }

    .footer {
      text-align: center;
      padding: 12px;
      font-size: 11px;
      color: #8a8a8a;
      border-top: 1px solid #202020;
    }

    .notification {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #ffca3a;
      color: #000;
      padding: 16px 24px;
      border-radius: 8px;
      font-weight: 700;
      z-index: 1000;
      pointer-events: none;
      animation: popIn .3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.5);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="header">
      <div class="brand">JORNADA <b>90</b></div>
      <div class="tagline">Simulador de Carreira no Futebol</div>
    </div>

    <div class="stats">
      <div class="stat-card">
        <span class="stat-value" id="overall">75</span>
        <div class="stat-label">OVERALL</div>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="money">100</span>
        <div class="stat-label">MOEDAS</div>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="week">1</span>
        <div class="stat-label">SEMANA</div>
      </div>
    </div>

    <div class="buttons" id="buttons"></div>

    <div class="footer">
      <div id="phase">Iniciando carreira...</div>
    </div>
  </div>

  <script>
    let audioContext;

    const playSound = (freq = 800, duration = 120) => {
      try {
        if (!audioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        const now = audioContext.currentTime;
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration / 1000);
        osc.start(now);
        osc.stop(now + duration / 1000);
      } catch (e) {
        console.log('Som indisponível');
      }
    };

    const vibrate = (pattern = 30) => {
      try {
        if (navigator.vibrate) {
          navigator.vibrate(pattern);
        }
      } catch (e) {
        console.log('Vibração indisponível');
      }
    };

    class CarreiraFC {
      constructor() {
        this.overall = 75;
        this.money = 100;
        this.week = 1;
        this.maxWeeks = 90;
        this.injuryRisk = 0;
        this.render();
      }

      treino() {
        vibrate(20);
        playSound(820, 90);
        const gain = Math.random() > 0.45 ? 1 : 0;
        this.overall = Math.min(99, this.overall + gain);
        this.injuryRisk += Math.random() * 12;
        this.showNotification(gain ? '⬆️ +1 Overall!' : '→ Sem progresso');
        this.nextWeek();
      }

      jogar() {
        vibrate([28, 50, 28]);
        playSound(980, 150);

        if (Math.random() < this.injuryRisk / 100) {
          this.overall = Math.max(50, this.overall - 5);
          this.money = Math.max(0, this.money - 50);
          this.showNotification('🤕 Lesão!');
        } else {
          const ganho = Math.floor((this.overall / 100) * 50);
          this.money += ganho;
          this.showNotification(`💰 +${ganho}`);
        }

        this.injuryRisk = 0;
        this.nextWeek();
      }

      clinica() {
        vibrate(40);
        playSound(620, 200);

        if (this.money >= 100) {
          this.money -= 100;
          this.overall = Math.min(99, this.overall + 8);
          this.injuryRisk = 0;
          this.showNotification('💊 Recuperado!');
        } else {
          this.showNotification('💸 Sem moedas!');
        }

        this.nextWeek();
      }

      descansar() {
        vibrate(25);
        playSound(700, 120);
        this.injuryRisk = Math.max(0, this.injuryRisk - 30);
        this.overall = Math.min(99, this.overall + 2);
        this.showNotification('😴 Recuperando...');
        this.nextWeek();
      }

      nextWeek() {
        this.week += 1;
        if (this.week > this.maxWeeks) {
          this.endGame();
        } else {
          this.render();
        }
      }

      endGame() {
        vibrate([50, 100, 50]);
        playSound(1200, 280);

        const ranking = this.overall >= 90 ? '🏆 LENDA' : this.overall >= 80 ? '⭐ ELITE' : this.overall >= 70 ? '👑 PRÓ' : '🟢 AMADOR';

        document.getElementById('app').innerHTML = `
          <div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;text-align:center;">
            <div style="font-size:48px;margin-bottom:10px;">${ranking}</div>
            <div style="font-size:28px;font-weight:900;margin-bottom:20px;color:#ffca3a;">${this.overall} OVERALL</div>
            <div style="font-size:18px;margin-bottom:30px;color:#8a8a8a;">Carreira Finalizada!</div>
            <button onclick="location.reload()" style="background:#42d77d;color:#000;padding:14px 28px;border:none;border-radius:8px;font-weight:700;font-size:16px;cursor:pointer;">Jogar Novamente</button>
          </div>
        `;
      }

      showNotification(msg) {
        const notif = document.createElement('div');
        notif.className = 'notification';
        notif.textContent = msg;
        document.body.appendChild(notif);
        setTimeout(() => notif.remove(), 1500);
      }

      render() {
        document.getElementById('overall').textContent = this.overall;
        document.getElementById('money').textContent = this.money;
        document.getElementById('week').textContent = `${this.week}/${this.maxWeeks}`;

        const injury = this.injuryRisk > 50 ? ' 🚨' : this.injuryRisk > 20 ? ' ⚠️' : '';
        document.getElementById('phase').textContent = `Semana ${this.week} - Risco de Lesão: ${Math.floor(this.injuryRisk)}%${injury}`;

        const actions = [
          { name: 'Treinar', detail: '+1 OVR', action: 'treino' },
          { name: 'Jogar', detail: 'Ganha moedas', action: 'jogar' },
          { name: 'Clínica', detail: '-100 coins', action: 'clinica' },
          { name: 'Descansar', detail: 'Menos lesão', action: 'descansar' }
        ];

        document.getElementById('buttons').innerHTML = actions.map((btn) => `
          <button class="btn" onclick="game.${btn.action}()">
            <div>${btn.name}</div>
            <div class="btn-value">${btn.detail}</div>
          </button>
        `).join('');
      }
    }

    const game = new CarreiraFC();
  </script>
</body>
</html>

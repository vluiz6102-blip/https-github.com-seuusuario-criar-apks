<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carreira FC</title>
<style>
:root{--bg:#0f1f2a;--pn:#172c3a;--ln:#27475b;--tx:#e9eef1;--mu:#8fa6b3;--gr:#3fae6a;--am:#f0b43c;--rd:#e0584f}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,sans-serif;padding:max(12px,env(safe-area-inset-top)) 12px max(16px,env(safe-area-inset-bottom))}
#app{max-width:520px;margin:0 auto}
h1,h2{font-family:"Arial Narrow",Impact,sans-serif;font-weight:700;letter-spacing:.2px}
h2{font-size:20px;margin-bottom:8px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:10px}
.head{display:flex;gap:12px;align-items:center}
.ovr{font:700 54px/1 "Arial Narrow",Impact,sans-serif;color:var(--am);min-width:64px;text-align:center}
.ovr small{display:block;font:12px system-ui;color:var(--mu)}
.mu{color:var(--mu);font-size:14px}
.bar{margin-top:8px}.bar div{height:7px;background:var(--ln);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%}
.bar span{font-size:13px;color:var(--mu)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;background:none;border:1px solid var(--ln);color:var(--mu);padding:9px;border-radius:8px;font-size:15px}
.tabs button.on{background:var(--gr);border-color:var(--gr);color:#08170e;font-weight:700}
.btn{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--ln);color:var(--tx);padding:12px;border-radius:8px;margin-top:8px;font-size:16px}
.btn:active{border-color:var(--gr)}
.btn b{display:block}.btn span{color:var(--mu);font-size:14px}
.go{background:var(--gr);color:#08170e;border:0;text-align:center;font-weight:700}
input,select{width:100%;padding:12px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font-size:16px;margin:6px 0 12px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 3px;text-align:center;border-bottom:1px solid var(--ln)}
td:nth-child(2),th:nth-child(2){text-align:left}
tr.me td{color:var(--am);font-weight:700}
.sc{font:700 34px "Arial Narrow",Impact,sans-serif;text-align:center}
.ln{font-size:15px;padding:3px 0;border-bottom:1px solid var(--ln)}
.ln.y{color:var(--am);font-weight:700}.ln.o{color:var(--mu)}
.tag{display:inline-block;background:var(--rd);color:#fff;border-radius:6px;padding:1px 8px;font-size:13px}
.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--ln);font-size:15px}

@keyframes up{from{opacity:0;transform:translateY(12px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes grow{from{width:0}}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
@keyframes fl2{from{opacity:0;transform:translateX(-14px)}}
.card{animation:up .35s both}
.bar i{animation:grow .8s both}
.ovr{animation:pop .5s both}
.sc{animation:pop .5s .1s both}
.ln{animation:fl2 .4s both;animation-delay:calc(var(--i,0)*.45s + .3s)}
.ln.y{color:var(--am);font-weight:700;animation:fl2 .4s both,pop .5s both;animation-delay:calc(var(--i,0)*.45s + .3s)}
.btn{transition:transform .12s,border-color .12s}.btn:active{transform:scale(.97)}
.art{display:flex;justify-content:center;gap:18px;padding:14px;margin:-2px -2px 10px;border-radius:8px;background:linear-gradient(135deg,#1f6f4a,#17445f 70%,#3a2c63)}
.art span{font-size:44px;line-height:1;display:inline-block;animation:fl 2.6s ease-in-out infinite}
.art span:nth-child(2){animation-delay:.5s}.art span:nth-child(3){animation-delay:1s}
.chips{display:flex;gap:6px;margin-top:6px}
.chip{flex:1;background:var(--bg);border:1px solid var(--ln);color:var(--mu);padding:9px 4px;border-radius:8px;font-size:14px}
.chip.on{border-color:var(--am);color:var(--am);font-weight:700}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@keyframes fall{from{transform:translateY(-20px) rotate(0);opacity:1}to{transform:translateY(190px) rotate(320deg);opacity:0}}
@keyframes gain{0%{color:#6ee09a;transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes loss{0%{color:var(--rd);transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(63,174,106,.6)}50%{box-shadow:0 0 0 8px rgba(63,174,106,0)}}
.card{position:relative;overflow:hidden}
.cf{position:absolute;left:0;right:0;top:0;height:0;pointer-events:none}
.cf span{position:absolute;top:0;left:var(--x);font-size:22px;animation:fall 1.9s var(--d) both}
.mny{display:inline-block}.mny.gain{animation:gain .9s both}.mny.loss{animation:loss .9s both}
.tag{animation:shake .5s 3}
.go{animation:pulse 2s infinite}
.btn{animation:up .3s both}
.still *{animation:none!important}
.pill{display:inline-block;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:2px 9px;font-size:13px;margin:0 4px 4px 0;color:var(--am)}
.tabs button{padding:7px 2px;font-size:12px}.tabs button span{display:block;font-size:18px;line-height:1.2}
.nt{border-color:var(--am)}.nt h2{color:var(--am);font-size:17px}
.chips.wr{flex-wrap:wrap;margin:0 0 10px}.chips.wr .chip{flex:1 1 30%}
.wc{background:linear-gradient(135deg,#183b52,#26334f);border-color:#4c7692}.wc .round{color:var(--am);font-weight:700}.sound{text-align:right;margin-bottom:6px}.sound .chip{flex:none;padding:5px 10px;font-size:12px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=id=>document.getElementById(id);
let audioOK=true,AC=null;try{audioOK=localStorage.getItem('carreirafc_som')!='0'}catch(e){}
function sfx(type){if(!audioOK)return;try{const C=window.AudioContext||window.webkitAudioContext;AC=AC||new C();const c=AC,o=c.createOscillator(),g=c.createGain(),now=c.currentTime,seq=type=='trophy'?[523,659,784,1047]:type=='correct'?[659,784,988]:type=='goal'?[392,523,659]:[220,196];o.connect(g);g.connect(c.destination);seq.forEach((f,i)=>o.frequency.setValueAtTime(f,now+i*.12));g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.12,now+.02);g.gain.exponentialRampToValueAtTime(.0001,now+seq.length*.12+.1);o.start();o.stop(now+seq.length*.12+.15)}catch(e){}}
function toggleSound(){audioOK=!audioOK;try{localStorage.setItem('carreirafc_som',audioOK?'1':'0')}catch(e){}render(1)}
const R=(a,b)=>a+Math.random()*(b-a),RI=(a,b)=>Math.floor(R(a,b+1)),cl=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const LG=[

{n:'Liga Saudita',c:['Al-Hilal:80','Al-Nassr:79','Al-Ittihad:76','Al-Ahli:76','Al-Qadsiah:72','Al-Shabab:68','Al-Ettifaq:66','Al-Fateh:62','Al-Taawoun:62','Damac:60']},

];

const VZ=10,TIERS=LG.map(l=>l.n);

const sa=()=>{const c=clubs(4)[RI(0,3)];c.tier=4;return c};

const mo=n=>S.morale=cl(S.morale+n),fa=n=>S.fame=cl(S.fame+n),en=n=>S.energy=cl(S.energy+n),mn=n=>{S.money+=n;if(n>0){S.se=(S.se||0)+n;S.te=(S.te||0)+n}},at=(k,n)=>(GRP[k]||[k]).forEach(x=>S.at[x]=cl(S.at[x]+n,25,99));
const REPS=['Desconhecido','Promessa','Revelação','Jogador conhecido','Estrela','Craque','Ídolo','Lenda'],CTRY=['Brasil','Brasil','Brasil','Portugal','Arábia Saudita','França','Alemanha','Itália','Espanha','Inglaterra','Brasil'];
const rep=()=>{const c=S.fame*.6+(S.titles||0)*3+(S.sel||0)*.4+Math.max(0,ovr()-60)*.8+(S.age<=21&&ovr()>=60?12:0);return REPS[c<8?0:c<20?(S.age<=21?1:2):c<32?3:c<48?4:c<68?5:c<92?6:7]};

const toast=(h,t)=>{(S.nt=S.nt||[]).push([h,t])},mm=t=>{S.mom.push({y:S.year,t});toast('📜 Momento histórico',t)},hl=(e,t,b)=>{S.hl.push({e,t,b});if(S.hl.length>6)S.hl.shift()},first=(k,t)=>{if(!S.fl[k]){S.fl[k]=1;mm(t)}};

E(['🎮','🃏'],'Seu cartão no jogo de videogame acabou de ser lançado.',[['Compartilhar','+fama',()=>fa(4)],['Reclamar da nota','+fama leve, -moral',()=>{fa(1);mo(-3)}],['Jogar com ele','+moral',()=>mo(5)]]),
E(['🗞️','❓'],'Um jornal diz que você vai para o maior rival.',[['Desmentir','+moral',()=>mo(2)],['Alimentar o rumor','+fama, -moral',()=>{fa(5);mo(-2)}],['Pedir aumento','+8% de salário, -moral',()=>{S.wage=Math.round(S.wage*1.08);mo(-3)}]]),

 return`<div class="card"><h2>Rodada ${S.r+1} de 18</h2><p class="mu">Próximo jogo: ${S.teams[rd[0]].n} x ${S.teams[rd[1]].n}</p>${ij?`<button class="btn go" onclick="train('rest')">Recuperar no departamento médico<br><span>Faltam ${S.inj} rodada(s)</span></button>`:`<p style="margin-top:8px">Postura do time no jogo:</p><div class="chips">${[['atk','Atacar'],['bal','Equilibrar'],['def','Defender']].map(t=>`<button class="chip ${tc==t[0]?'on':''}" onclick="S.tac='${t[0]}';render(1)">${t[1]}</button>`).join('')}</div><p style="margin-top:10px">Como será o treino da semana?</p>${S.sus>0?'<p class="mu" style="margin-top:8px">Você está suspenso e não joga esta rodada.</p>':''}${TRL.map(t=>`<button class="btn" onclick="train('${t[0]}')"><b>${t[1]}</b><span>${t[2]}</span></button>`).join('')}`}</div>`}
const vacV=()=>ntV()+`<div class="card">${art(['🏖️','✈️'])}<h2>Férias</h2><p class="mu">Antes de ouvir propostas, como será a pausa?</p>${[['Descansar em casa','Energia cheia e +moral'],['Viajar com a família','-R$ 60 mil, +moral'],['Treinar nas férias','+técnica e físico, -moral'],['Fechar com patrocinadores','+R$ 100 mil, +fama']].map((o,i)=>`<button class="btn" onclick="vac(${i})"><b>${o[0]}</b><span>${o[1]}</span></button>`).join('')}</div>`;
function vac(k){if(k==0)mo(8);if(k==1){mn(-60);mo(12)}if(k==2){at('tec',.8);at('fis',.8);mo(-3)}if(k==3){mn(100);fa(3)}S.phase='end';render()}
const pk=(a,k)=>a[k%a.length];
function newsV(){
 const l=S.last,tm=S.club.n,nm=S.name,pos=order().indexOf(S.me)+1,tb=S.tbl[S.me],k=S.r+S.age;
 let m=['👋',nm+' chega com vontade de aparecer',`O jovem ${POSN[S.pos].toLowerCase()} de ${S.age} anos quer ganhar espaço no ${tm}.`],t=['📅',tm+' se prepara para a estreia',`A temporada da ${TIERS[S.club.tier]} está prestes a começar.`];
 if(l){
  const home=l.h==tm,my=home?l.gh:l.ga,op=home?l.ga:l.gh,rv=home?l.a:l.h,sc=`${l.h} ${l.gh} x ${l.ga} ${l.a}`;
  t=my>op?['📈',pk([`${tm} vence o ${rv} e embala`,`Vitória do ${tm} sobre o ${rv}`],k),`${sc}. O time soma ${pts(tb)} pontos e é o ${pos}º colocado.`]:my<op?['📉',pk([`${tm} perde para o ${rv} e a pressão aumenta`,`Derrota amarga do ${tm}`],k),`${sc}. A equipe está em ${pos}º lugar, com ${pts(tb)} pontos.`]:['⚖️',`${tm} empata com o ${rv}`,`${sc}. O time é o ${pos}º colocado, com ${pts(tb)} pontos.`];
  if(pos==1&&S.r>3)t=['🏆',`${tm} lidera a ${TIERS[S.club.tier]}`,`Com ${pts(tb)} pontos em ${S.r} rodadas, o time sonha com o título.`];
  const rt=l.rt?l.rt.toFixed(1):'';
  if(S.inj>0)m=['🩺',nm+' é desfalque no '+tm,`O departamento médico diz que ele precisa de mais ${S.inj} rodada(s) para voltar.`];
  else if(!l.min)m=['🪑',`${nm} fica fora do jogo contra o ${rv}`,'O técnico preferiu outras opções e o jogador espera uma chance.'];
  else if(l.g>=2)m=['🔥',`${nm} brilha e faz ${l.g} gols`,`Nota ${rt}: atuação de craque contra o ${rv}.`];
  else if(l.g==1)m=['⚽',`${nm} marca contra o ${rv}`,`Nota ${rt}. Ele soma ${S.ss.g} gol(s) na temporada.`];
  else if(l.as>0)m=['🅰️',nm+' dá passe decisivo',`Nota ${rt}. Ele soma ${S.ss.a} assistência(s) na temporada.`];
  else if(l.rt<5.5)m=['😬',nm+' vai mal e vira alvo da torcida',`Nota ${rt}. O jogador precisa reagir na próxima rodada.`];
  else if(S.fame>60)m=['📸',nm+' é o assunto do momento','Convites e propostas chegam de todos os lados.'];
  else m=['📋',`${nm} cumpre o papel contra o ${rv}`,`Nota ${rt} em ${l.min} minutos de jogo.`]
 }
 if((S.fame>=35||S.age<=21)&&Math.random()<.24){const st=['Neymar','Vinícius Jr.','Mbappé','Haaland','Bellingham','Salah','De Bruyne'],n=st[RI(0,st.length-1)];m=Math.random()<.52?['🌟',n+': "Esse garoto tem algo diferente. Vale ficar de olho nele."','Comentário elogiando seu talento ganha destaque internacional.']:['🌟',n+': "Ele ainda precisa provar mais antes de ser colocado entre os grandes."','A declaração vira assunto nas redes e aumenta a pressão sobre você.']}
 const c=(e,s)=>`<div class="card">${art([e[0]])}<div class="mu">${s}</div><h2>${e[1]}</h2><p>${e[2]}</p></div>`;
 return c(m,'Sobre você')+c(t,'Sobre o '+tm)+(S.hl.length?`<div class="card"><h2>Manchetes</h2>${S.hl.slice().reverse().map(h=>`<div class="row"><span>${h.e} <b>${h.t}</b><br><span class="mu">${h.b}</span></span></div>`).join('')}</div>`:'')
}
function tblV(){return`<div class="card"><h2>${TIERS[S.club.tier]}</h2><table><tr><th>#</th><th>Time</th><th>P</th><th>J</th><th>V</th><th>SG</th></tr>${order().map((i,k)=>{const t=S.tbl[i];return`<tr class="${i==S.me?'me':''}"><td>${k+1}</td><td>${S.teams[i].n}</td><td>${pts(t)}</td><td>${t.w+t.d+t.l}</td><td>${t.w}</td><td>${t.gf-t.ga}</td></tr>`}).join('')}</table></div>`}
let ct='res';
const rows=a=>a.map(r=>`<div class="row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('');
const trV=()=>`<div class="card"><h2>Museu de troféus</h2>${S.tro.length?S.tro.map(t=>`<div class="row"><span>🏆 ${t.n}</span><span class="mu">${t.y}${t.c?' | '+t.c:''}</span></div>`).join(''):'<p class="mu">Nenhum troféu ainda.</p>'}</div>`;
const tlV=()=>`<div class="card"><h2>Linha do tempo</h2>${S.mom.length?S.mom.map(m=>`<div class="row"><b>${m.y}</b><span style="text-align:right">${m.t}</span></div>`).join(''):'<p class="mu">Os momentos históricos aparecem aqui.</p>'}</div>`;
const recV=()=>`<div class="card"><h2>Recordes pessoais</h2>${rows([['Gols em uma temporada',S.rc.sg||0],['Assistências em uma temporada',S.rc.sa||0],['Gols em uma partida',S.rc.mg||0],['Sequência de jogos marcando',S.rc.stk||0],['Títulos em uma temporada',S.rc.ts||0],['Overall máximo',Math.max(S.rc.ov||0,ovr())],['Fama máxima',Math.round(Math.max(S.rc.fm||0,S.fame))],['Valor de mercado máximo','R$ '+fm(Math.max(S.rc.mv||0,mv()))],['Jogos pela seleção',S.sel||0],['Gols pela seleção',S.sgl||0]])}</div>`;
const objV=()=>`<div class="card"><h2>Objetivos de carreira</h2>${FEATS.map((f,i)=>f.h?'':`<div class="row"><span>${S.done[i]?'✅':'⬜'} ${f.t}</span>${S.done[i]?`<span class="mu">${S.done[i]}</span>`:''}</div>`).join('')}</div><div class="card"><h2>Conquistas secretas</h2>${FEATS.map((f,i)=>f.h?`<div class="row"><span>${S.done[i]?'🔓 '+f.t:'🔒 Conquista secreta'}</span></div>`:'').join('')}</div>`;
const resV=()=>`<div class="card"><h2>Números da carreira</h2>${rows([['Clubes',S.clubs.length],['Temporadas',S.hist.length],['Jogos',S.tot.j],['Gols',S.tot.g],['Assistências',S.tot.a],['Títulos',S.titles],['Seleção',(S.sel||0)+' jogo(s), '+(S.sgl||0)+' gol(s)'],['Acessos',S.promos||0],['Contrato',S.yrs+' ano(s) · R$ '+fm(S.wage)+'/mês'],['Patrimônio','R$ '+fm(S.money)]])}<p class="mu" style="margin-top:8px">${S.clubs.map(c=>c.n+' ('+c.y+')').join(' → ')}</p></div><div class="card"><h2>Temporadas</h2>${S.hist.map(h=>`<div class="row"><span>${h.y} ${h.c}<br><span class="mu">${h.t} · ${h.p}º lugar</span></span><span style="text-align:right">${h.g}G ${h.a}A<br><span class="mu">nota ${h.avg}</span></span></div>`).join('')||'<p class="mu">Nenhuma temporada completa ainda.</p>'}</div>`;
function careerV(){const T=[['res','Resumo'],['tro','Troféus'],['rec','Recordes'],['obj','Metas'],['tl','Linha do tempo']];return`<div class="chips wr">${T.map(([k,l])=>`<button class="chip ${ct==k?'on':''}" onclick="ct='${k}';render(1)">${l}</button>`).join('')}</div>`+({res:resV,tro:trV,rec:recV,obj:objV,tl:tlV}[ct])()}
function playerV(){const l=['Muito ruim','Ruim','Normal','Boa','Ótima','Excelente'],ci=S.coach<15?0:S.coach<35?1:S.coach<55?2:S.coach<70?3:S.coach<85?4:5,top=topAt(3);
 return`<div class="card"><h2>${STY()}</h2><div class="mu">Reputação: <b>${rep()}</b> · Valor de mercado: <b>R$ ${fm(mv())}</b></div><div class="mu">Relação com o técnico: <b>${l[ci]}</b>${S.cap?' · Capitão':''}</div>${bar('Relação com o técnico',S.coach,'#c58af0')}</div><div class="card"><h2>Atributos</h2><p class="mu">Os atributos com ★ pesam mais no geral de um ${POSN[S.pos].toLowerCase()}.</p>${AK.map(k=>bar(AN[k]+(top.includes(k)?' ★':''),S.at[k],S.at[k]>=80?'var(--am)':'var(--gr)')).join('')}</div><div class="card"><h2>Finanças</h2>${rows([['Saldo','R$ '+fm(S.money)],['Salário','R$ '+fm(S.wage)+'/mês'],['Ganhos da temporada','R$ '+fm(S.se||0)],['Ganhos totais','R$ '+fm(S.te||0)],['Contrato',S.yrs+' ano(s)']])}</div>`}
function endV(){const m=S.sum;return ntV()+`<div class="card">${m.champ?conf('🎉'):''}${art([m.champ?'🏆':'📅','🎉'])}<h2>Fim da temporada ${S.year-1}</h2><p>${m.champ?'Seu time foi campeão!':'Seu time terminou em '+m.pos+'º lugar.'}</p>${m.ex.map(x=>`<p>${x}</p>`).join('')}<p class="mu">${m.j} jogos · ${m.g} gols · ${m.a} assistências · nota média ${m.avg}</p></div><div class="card">${art(['✈️','💼'])}<h2>Seu futuro</h2>${S.yrs>0?`<button class="btn" onclick="keep()"><b>Cumprir o contrato</b><span>Restam ${S.yrs} ano(s) · R$ ${fm(S.wage)}/mês</span></button>`:''}<button class="btn" onclick="stay(2)"><b>Ficar no ${S.club.n}</b><span>Renovar por 2 anos · R$ ${fm(S.stayW)}/mês</span></button><button class="btn" onclick="stay(4)"><b>Renovar por 4 anos</b><span>Salário 12% maior · R$ ${fm(Math.round(S.stayW*1.12))}/mês</span></button>${S.offers.map((o,i)=>`<button class="btn" onclick="go(${i})"><b>${o.n}</b><span>${o.pre?'Pré-contrato assinado · ':''}${TIERS[o.tier]} · 3 anos · R$ ${fm(o.w)}/mês${o.role?`<br>${o.role} · camisa ${o.num}`:''}</span></button>`).join('')}${S.age>=32?`<button class="btn" onclick="retire()"><b>Aposentar</b><span>Encerrar a carreira aos ${S.age} anos</span></button>`:''}</div>`}
const phrase=()=>S.titles>=10?'Uma carreira marcada por títulos e grandes decisões.':S.tot.g>=250?'Uma carreira construída com gols e regularidade.':(S.sel||0)>=40?'Um atleta que brilhou também com a camisa da seleção.':S.clubs.length>=6?'Uma carreira de muitas estradas e muitos desafios.':S.clubs.length<=2?'Um jogador que virou símbolo de poucos clubes.':'Uma carreira de superação, trabalho e boas histórias.';
function retV(){return`<div class="card">${conf('🏆')}${art(['🏅','🏆'])}<h2>Fim de carreira</h2><p>${S.name} se aposentou aos ${S.age} anos como <b>${rep()}</b>.</p><p class="mu" style="margin:6px 0">${phrase()}</p>${rows([['Jogos',S.tot.j],['Gols',S.tot.g],['Assistências',S.tot.a],['Títulos',S.titles],['Clubes',S.clubs.length],['Patrimônio','R$ '+fm(S.money)]])}<button class="btn go" onclick="reset()">Começar nova carreira</button></div>${resV()}${trV()}${tlV()}`}
function intro(){const o=a=>a.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');if(!START_OFFERS.length)START_OFFERS=makeStartOffers();return`<div class="card">${art(['⚽','🏆','🌍'])}<h1 style="font-size:30px">Carreira FC</h1><p class="mu">Você começa aos 17 anos. Clubes podem apostar em você antes da fama.</p><label>Nome do jogador<input id="nm" maxlength="20" placeholder="Seu nome"></label><label>Posição<select id="ps">${o(Object.keys(POSN).map(k=>[k,POSN[k]]))}</select></label><label>Ponto forte<select id="st">${o([['tec','Técnica'],['fis','Físico'],['men','Mental']])}</select></label><h3 style="margin-top:14px">Clubes interessados em você</h3>${START_OFFERS.map((x,i)=>`<button class="btn" onclick="start(${i})"><b>${x.n}</b><span>${TIERS[x.tier]} · ${x.varzea?'Várzea · sem salário fixo':'Profissional · R$ '+fm(x.w)+'/mês'}</span></button>`).join('')}</div>`}
function wcV(){const w=S.wc,l=w.last,df=S.pos=='GOL'||S.pos=='ZAG';
 if(w.q==0)return`<div class="card wc">${art(['🇧🇷','🏆'])}<span class="round">${WCR[w.r]}</span><h2>Brasil x ${w.opp[w.r]}</h2><p>Copa do Mundo ${S.year-1}. ${w.r<3?'Pontos no grupo: '+w.pts+'. ':'Jogo eliminatório: quem perder está fora. '}Como o Brasil vai jogar?</p><button class="btn" onclick="wcPlay(0)"><b>Atacar</b><span>Mais chances de gol, maior desgaste</span></button><button class="btn" onclick="wcPlay(1)"><b>Equilibrar</b><span>Controle e segurança</span></button><button class="btn" onclick="wcPlay(2)"><b>Jogar no contra-ataque</b><span>Menos gols sofridos, menos desgaste</span></button></div>`;
 if(w.q==1)return`<div class="card wc"><span class="round">${l.st}</span><h2>Brasil ${l.my} x ${l.og} ${l.opp}</h2><p><b>Acréscimos.</b> ${df?'O adversário parte em contra-ataque perigoso na sua direção.':'A bola sobra para você na entrada da área.'}</p><button class="btn go" onclick="wcDec(1)"><b>${df?'Fazer a intervenção':'Assumir a finalização'}</b><span>Depende de ${df?'defesa':'finalização'} e moral</span></button><button class="btn" onclick="wcDec(0)"><b>${df?'Deixar para a defesa':'Tocar para o companheiro'}</b><span>Menos pressão sobre você</span></button></div>`;
 return`<div class="card wc">${w.end=='champ'?conf('🏆'):l.g?conf('⚽'):''}<span class="round">${l.st}</span><div class="sc">Brasil ${l.my} x ${l.og} ${l.opp}</div><p>${l.ln.join(' ')}</p><p class="mu">${l.res} · seus gols: ${l.g}${w.r<3?' · pontos no grupo: '+w.pts:''}</p>${w.end=='champ'?'<h2>🏆 O Brasil é campeão do mundo!</h2>':w.end?'<p>O Brasil está eliminado.</p>':''}<button class="btn go" onclick="wcNext()">${w.end?'Voltar para a carreira':'Próximo jogo'}</button></div>`}
function save(){try{localStorage.setItem('carreirafc2',JSON.stringify(S))}catch(e){}}
function render(still){
 const A=$('app');A.className=still?'still':'';if(!S){A.innerHTML=intro();return}
 let h=head();
 if(S.phase=='wc')h+=sndB()+wcV();else if(S.phase=='comp')h+=sndB()+compV();else if(S.phase=='retired')h=retV();else if(S.phase=='vac')h+=vacV();else if(S.phase=='end')h+=endV();else h+=tabs()+(tab=='game'?gameV():tab=='tbl'?tblV():tab=='news'?newsV():tab=='ply'?playerV():careerV());
 A.innerHTML=h;S.lm=S.money;save();
 if(!still){window.scrollTo(0,0);if(document.querySelectorAll)document.querySelectorAll('.btn').forEach((b,i)=>b.style.animationDelay=i*.05+'s')}
}
function mig(s){if(!s||!s.teams||!s.club||!s.fx||!s.tbl)return null;
 s=Object.assign({v:3,coach:50,cap:0,hl:[],mom:[],fl:{},rc:{},rf:{},done:{},clubs:[],se:0,te:0,ih:0,strk:0,nog:0,tac:'bal',sel:0,sgl:0,promos:0,sus:0,tro:[],nt:[],scoutOffers:[]},s);
 if(!s.at){s.at={};AK.forEach(k=>s.at[k]=cl(+(GRP.tec.includes(k)?s.tec:GRP.fis.includes(k)?s.fis:s.men)||50,25,99))}
 AK.forEach(k=>{if(typeof s.at[k]!='number'||!isFinite(s.at[k]))s.at[k]=50});['coach','money','energy','morale','fame','titles','sel','sgl'].forEach(k=>{if(typeof s[k]!='number'||!isFinite(s[k]))s[k]={coach:50,energy:90,morale:70}[k]||0});s.tot=s.tot||{g:0,a:0,j:0};
 s.tro=s.tro.map(t=>typeof t=='string'?{n:t,y:'',c:'',p:''}:t);
 if(!s.clubs.length)s.clubs=[{n:s.club.n,y:s.year}];
 if(s.phase=='comp'&&!((s.comps||[])[s.cmp]||{}).active){s.phase='pre';s.cmp=null}
 if(s.phase=='wc'&&(!s.wc||s.wc.v!=2)){s.wc=null;s.phase=s.age>=38?'retired':'vac';s.offers=s.offers||[];s.stayW=s.stayW||s.wage;s.sum=s.sum||{pos:'-',avg:'0',g:0,a:0,j:0,ex:[]}}
 return s}
try{S=mig(JSON.parse(localStorage.getItem('carreirafc2')))}catch(e){S=null}
if(S){if(!S.comps){compSetup();compSchedule()}S.comps.forEach(c=>{if(!c.groupLen&&c.kind!='cup')c.groupLen=c.id=='ucl'?8:6;c.sc=c.sc||[];if(!c.sc.some(x=>x.me))c.sc.push({n:S.name,g:0,me:1})});}
render();
</script>

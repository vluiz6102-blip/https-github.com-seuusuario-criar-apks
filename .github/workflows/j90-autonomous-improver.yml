name: Jornada 90 Autonomous AI Team

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for starting the AI team"
        required: false
        default: "Full build completed"
      source_run_id:
        description: "Build run to inspect"
        required: false
        default: ""
      source_conclusion:
        description: "Previous build result"
        required: false
        default: "success"

concurrency:
  group: jornada90-ai-team
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  coordinator:
    name: "IA 1 - Coordenadora"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Auth
        id: auth
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          test -n "$COPILOT_GITHUB_TOKEN"
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Configurar Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Contexto da build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_CONCLUSION: ${{ inputs.source_conclusion }}
        run: |
          set -e
          mkdir -p .j90-team
          echo "source_run_id=$RUN_ID" > .j90-team/context.txt
          echo "source_conclusion=$SOURCE_CONCLUSION" >> .j90-team/context.txt
          echo "commit=$GITHUB_SHA" >> .j90-team/context.txt
          if [ -n "$RUN_ID" ]; then gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > .j90-team/last-build.log 2>&1 || true; fi
      - name: Instalar Copilot
        env:
          GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: npm install -g @github/copilot
      - name: Planejar
        env:
          GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set -e
          copilot -p "$(cat <<'PROMPT'
Você é a IA 1, COORDENADORA do time Jornada 90.
Leia .github/copilot-instructions.md, .j90-team/context.txt, logs e código.
Não altere o código nesta etapa. Crie .j90-team/plan.md.
Distribua ordens sem sobreposição para GAMEPLAY_AI, PERFORMANCE_STABILITY, UX_MOBILE, MANAGER_TACTICS e MATCH_AUDIO_CONTENT.
Para cada área informe prioridade P0/P1/P2, problema/oportunidade comprovado, arquivos/sistemas, ação esperada, testes e riscos.
Se a build anterior falhou, a causa raiz é P0. Não invente problemas e não copie EA/FIFA.
PROMPT
)" --no-banner --allow-tool='read,write,shell' --deny-tool='shell(git push)' --deny-tool='shell(git commit)' --deny-tool='shell(gh workflow)' --deny-tool='shell(gh release)' --deny-tool='shell(gh secret)'
          test -s .j90-team/plan.md
      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: j90-team-plan
          path: .j90-team/plan.md
          retention-days: 7

  gameplay-ai:
    name: "IA 2 - Gameplay e Football AI"
    needs: coordinator
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Baixar ordem da coordenadora
        uses: actions/download-artifact@v4
        with:
          name: j90-team-plan
          path: .j90-team
      - name: Instalar Copilot
        env:
          GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: npm install -g @github/copilot
      - name: Analisar missão
        env:
          GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set -e
          copilot -p "$(cat <<'PROMPT'
Você é IA 2 - Gameplay e Football AI, especialista do time Jornada 90.
Leia .github/copilot-instructions.md e .j90-team/plan.md.
Execute SOMENTE a missão GAMEPLAY_AI: dribles, passes, movimentação, transições, decisão, comportamento de craques e equilíbrio.
Você é analista nesta etapa. Não faça commit, push ou release.
Não enfraqueça testes, não apague funcionalidades e não copie assets protegidos.
Produza .j90-team/gameplay-ai.md com diagnóstico baseado no código, mudanças recomendadas em ordem, arquivos-alvo, testes, riscos e conflitos.
PROMPT
)" --no-banner --allow-tool='read,write,shell' --deny-tool='shell(git push)' --deny-tool='shell(git commit)' --deny-tool='shell(gh workflow)' --deny-tool='shell(gh release)' --deny-tool='shell(gh secret)'
          test -s .j90-team/gameplay-ai.md
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: j90-team-gameplay-ai
          path: .j90-team/gameplay-ai.md
          retention-days: 7


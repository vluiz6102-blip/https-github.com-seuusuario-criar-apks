  integrator:
    name: "IA 7 - Integradora e Release Manager"
    needs: [coordinator, gameplay-ai, performance, ux, manager, match-content]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Auth
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: test -n "$COPILOT_GITHUB_TOKEN"
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Baixar plano
        uses: actions/download-artifact@v4
        with:
          name: j90-team-plan
          path: .j90-team
      - name: Baixar relatórios
        uses: actions/download-artifact@v4
        with:
          pattern: j90-team-*
          path: .j90-team/reports
          merge-multiple: true
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install
      - name: Instalar Copilot
        env:

          PROMPT
          J90_AI_PREFERENCE="gemini,nvidia,anthropic,openai,aimlapi,kie,openrouter,groq,copilot" J90_AI_MAX_OUTPUT_TOKENS=12000 node scripts/j90-ai-report.mjs --prompt-file ".j90-team/ai-4-prompt.txt" --output-file ".j90-team/ux.md"
          test -s .j90-team/ux.md
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: j90-team-ux
          path: .j90-team/ux.md
          retention-days: 7

  manager:
    name: "IA 5 - Manager, transferências e táticas"
    needs: coordinator
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Baixar ordem da coordenadora
        uses: actions/download-artifact@v4
        with:
          name: j90-team-plan
          path: .j90-team
      - name: Preparar provedores de IA
        run: npm install -g @google/gemini-cli @github/copilot
      - name: Analisar missão com pool multi-modelo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_INFERENCE_API_KEY: ${{ secrets.NVIDIA_INFERENCE_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AIMLAP_API_KEY: ${{ secrets.AIMLAP_API_KEY }}
          OPENRAUTER_API_KEY: ${{ secrets.OPENRAUTER_API_KEY }}
          KIE_AI_TOKEN: ${{ secrets.KIE_AI_TOKEN }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          AIMLAPI_MODEL: ${{ vars.AIMLAPI_MODEL }}
          KIE_MODEL: ${{ vars.KIE_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}

name: Jornada 90 Autonomous Game Improver

on:
  workflow_run:
    workflows: ["Build APK Jornada 90 Manager"]
    types: [completed]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for starting the autonomous improvement cycle"
        required: false
        default: "Manual autonomous game improvement"

concurrency:
  group: jornada90-autonomous-improver
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  copilot-requests: write

jobs:
  improve:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.name == 'Build APK Jornada 90 Manager'
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Capture latest build result
        env:
          GH_TOKEN: \${{ github.token }}
          RUN_ID: \${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p .j90-autonomy
          echo "run_id=\${RUN_ID:-manual}" | tee .j90-autonomy/context.txt
          echo "commit=\${GITHUB_SHA}" | tee -a .j90-autonomy/context.txt
          if [ -n "\${RUN_ID:-}" ]; then
            gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > .j90-autonomy/last-build.log 2>&1 || true
            gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json status,conclusion,headSha,event,name,url > .j90-autonomy/last-build.json
          fi

      - name: Install dependencies
        run: npm install

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Autonomous engineering pass
        env:
          GITHUB_TOKEN: \${{ github.token }}
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          rm -f .j90-release-ready.json

          copilot -p "$(cat <<'PROMPT'
You are the autonomous lead developer of Jornada 90 Manager.

Read .github/copilot-instructions.md first.

The latest build context is in .j90-autonomy/context.txt and, when available, .j90-autonomy/last-build.log and .j90-autonomy/last-build.json.

Mission:
- inspect the actual repository;
- fix the root cause of the latest failure when there is one;
- otherwise make the next concrete, safe, user-visible improvement to the game;
- run targeted tests after editing;
- never weaken or remove tests;
- never disable release gates;
- never change secrets;
- never git push or create releases;
- preserve all existing game systems and the single-source build;
- keep the app installable.

Before declaring ready, review gameplay, AI, UX, performance, stability, manager/squad/transfer/tactics/match/event/landscape systems, audio integration and content.

Only when the repository satisfies the complete release contract and there is no material safe improvement remaining, create .j90-release-ready.json exactly as specified in .github/copilot-instructions.md.

If it is not ready, do not create a ready marker.

At the end, briefly report what changed and what you tested.
PROMPT
)" --no-banner --allow-tool='read,write,shell' --deny-tool='shell(git push)' --deny-tool='shell(git commit)' --deny-tool='shell(rm)'

      - name: Validate autonomous changes
        run: |
          set -euo pipefail
          npm run build
          node scripts/release-readiness.mjs

      - name: Commit and request next full build
        if: success()
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f .j90-release-ready.json ] && node -e "process.exit(JSON.parse(require('fs').readFileSync('.j90-release-ready.json','utf8')).ready===true?0:1)"; then
            echo "JORNADA90_AUTONOMY=RELEASE_READY"
            exit 0
          fi

          git config user.name "Jornada 90 Autonomous Improver"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Agent produced no improvement and did not prove readiness."
            exit 1
          fi
          git commit -m "autonomy: improve Jornada 90"
          git push origin HEAD:main

          gh workflow run build-apk.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Final ready state
        if: success()
        run: |
          echo "JORNADA90_AUTONOMY=RELEASE_READY"
          echo "No further autonomous cycle is launched."

          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_INFERENCE_API_KEY: ${{ secrets.NVIDIA_INFERENCE_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AIMLAP_API_KEY: ${{ secrets.AIMLAP_API_KEY }}
          OPENRAUTER_API_KEY: ${{ secrets.OPENRAUTER_API_KEY }}
          KIE_AI_TOKEN: ${{ secrets.KIE_AI_TOKEN }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          AIMLAPI_MODEL: ${{ vars.AIMLAPI_MODEL }}
          KIE_MODEL: ${{ vars.KIE_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
        run: |
          set -e
          cat > .j90-team/ai-3-prompt.txt <<'PROMPT'
          Você é IA 3 - Performance e estabilidade, especialista do time Jornada 90.
          Leia .github/copilot-instructions.md e .j90-team/plan.md.
          Execute SOMENTE a missão PERFORMANCE_STABILITY: RAF/timers, DOM, listeners, leaks, startup, Canvas, memória, crashes e rotação.
          Você é analista nesta etapa. Não faça commit, push ou release.
          Não enfraqueça testes, não apague funcionalidades e não copie assets protegidos.
          Produza .j90-team/performance.md com diagnóstico baseado no código, mudanças recomendadas em ordem, arquivos-alvo, testes, riscos e conflitos.
          PROMPT
          J90_AI_PREFERENCE="gemini,nvidia,anthropic,openai,aimlapi,kie,openrouter,groq,copilot" J90_AI_MAX_OUTPUT_TOKENS=12000 node scripts/j90-ai-report.mjs --prompt-file ".j90-team/ai-3-prompt.txt" --output-file ".j90-team/performance.md"
          test -s .j90-team/performance.md
      - name: Upload report
        uses: actions/upload-artifact@v4

name: Import FM26 source

on:
  push:
    branches:
      - j90-fusion-manager-2d
    paths:
      - '.github/workflows/import-fm26.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: ${{ !contains(github.event.head_commit.message, 'chore: import FM26 source') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Jornada 90
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone FM26
        run: |
          set -euo pipefail
          rm -rf /tmp/fm26
          git clone --depth 1 https://github.com/vfxper/fm26.git /tmp/fm26

      - name: Copy FM26 source tree
        run: |
          set -euo pipefail
          rm -rf third_party/fm26
          mkdir -p third_party/fm26
          cp -a /tmp/fm26/. third_party/fm26/
          rm -rf third_party/fm26/.git
          cat > third_party/fm26/IMPORTED_FROM_FM26.md <<'EOF'
# FM26 imported source

This directory is a source snapshot imported from https://github.com/vfxper/fm26
for the Jornada 90 Manager migration.

Original upstream repository: vfxper/fm26
Imported by the Jornada 90 migration workflow.
EOF

      - name: Commit imported source
        run: |
          set -euo pipefail
          git config user.name "Jornada 90 Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add third_party/fm26
          git diff --cached --quiet && exit 0
          git commit -m "chore: import FM26 source"
          git push origin HEAD:j90-fusion-manager-2d

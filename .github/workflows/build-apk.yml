name: Build Jornada 90 APK from Godot source

on:
  push:
    branches:
      - goal/open-source-replacement
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jornada90-open-source-apk
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout including game engine source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Download Godot 4.6.2 and matching export templates
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.2.stable" /tmp/godot
          curl -fsSL --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip \
            -o /tmp/godot/godot.zip
          curl -fsSL --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_export_templates.tpz \
            -o /tmp/godot/templates.tpz
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          unzip -q /tmp/godot/templates.tpz -d /tmp/godot/template-unpack
          cp -a /tmp/godot/template-unpack/templates/. "$HOME/.local/share/godot/export_templates/4.6.2.stable/"
          chmod +x /tmp/godot/Godot_v4.6.2-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"

      - name: Prepare fictional offline data and Android preset
        run: |
          set -euo pipefail
          python3 scripts/prepare-mobile-data.py
          cp export_presets.android.cfg game-source/export_presets.cfg
          mkdir -p game-source/build

      - name: Import resources and validate startup scene
        run: |
          set -euo pipefail
          GODOT=/tmp/godot/Godot_v4.6.2-stable_linux.x86_64
          "$GODOT" --headless --editor --path game-source --import
          "$GODOT" --headless --path game-source --quit-after 8

      - name: Export Android APK
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.6.2-stable_linux.x86_64 \
            --headless --path game-source \
            --export-debug "Android" "$GITHUB_WORKSPACE/game-source/build/Jornada90.apk"
          test -s game-source/build/Jornada90.apk
          file game-source/build/Jornada90.apk
          sha256sum game-source/build/Jornada90.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jornada90-Android-debug
          path: game-source/build/Jornada90.apk
          if-no-files-found: error
          retention-days: 14

name: Build APK Carreira FC

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'www/index.html'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v5
      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependências
        run: npm install
      - name: Preparar Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
      - name: Aplicar identidade e ícone Jornada 90
        working-directory: android
        run: |
          python3 - <<'PY'
          import os, subprocess
          src='../assets/icon.svg'
          sizes={'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for d,n in sizes.items():
              out=f'app/src/main/res/mipmap-{d}'
              os.makedirs(out,exist_ok=True)
              subprocess.run(['convert',src,'-resize',f'{n}x{n}',f'{out}/ic_launcher.png'],check=True)
              subprocess.run(['cp',f'{out}/ic_launcher.png',f'{out}/ic_launcher_round.png'],check=True)
          # Legacy + adaptive launcher resources. Android 12+ can use mipmap-anydpi-v26 instead of PNGs.
          mkdir -p app/src/main/res/drawable-nodpi app/src/main/res/mipmap-anydpi-v26
          convert "$src" -resize 1024x1024 app/src/main/res/drawable-nodpi/j90_icon.png
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "app/src/main/res/mipmap-$density/ic_launcher.png" "app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/j90_icon_background" />
            <foreground android:drawable="@drawable/j90_icon" />
            <monochrome android:drawable="@drawable/j90_icon" />
          </adaptive-icon>
          XML
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/j90_icon_background" />
            <foreground android:drawable="@drawable/j90_icon" />
            <monochrome android:drawable="@drawable/j90_icon" />
          </adaptive-icon>
          XML
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/j90_icon_colors.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <color name="j90_icon_background">#0B1822</color>
          </resources>
          XML
          PY
      - name: Gerar APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: jornada-90-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

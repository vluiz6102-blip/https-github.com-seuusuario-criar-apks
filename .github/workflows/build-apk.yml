name: Build APK Jornada 90 Manager
# Continuous asset-based soundscape build
# Roster and soundscape validation build

concurrency:
  group: jornada90-apk-build
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'scripts/build.mjs'
      - 'scripts/sync-rosters.mjs'
      - 'src/**'
      - 'scripts/generate-content-pack.py'
      - 'scripts/browser-smoke.mjs'
      - 'scripts/diag-smoke.mjs'
      - 'diag.html'
      - 'scripts/quality-scan.mjs'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'android-overrides/**'
      - 'assets/**'
      - 'data/**'
      - 'audio-import/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
      actions: write
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependências
        run: npm install

      - name: Preflight de código
        run: |
          python3 -m py_compile scripts/generate-content-pack.py
          node --check scripts/browser-smoke.mjs
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html','utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).join('\n');
          new Function(scripts);
          if (/playerPhotos|j90PlayerPhoto|COMMONS_API|Wikimedia/i.test(scripts)) throw new Error('Player photo code still present.');
          if ((scripts.match(/setInterval\s*\(/g)||[]).length) throw new Error('setInterval detected.');
          console.log('PREFLIGHT_JS=OK');
          NODE

      - name: Preparar ferramentas de conteúdo
        run: sudo apt-get update && sudo apt-get install -y python3-pil

      - name: Sincronizar elencos reais dos times
        run: npm run data:rosters

      - name: Verificar scanner de qualidade usado no CI
        run: |
          set -euo pipefail
          echo "CI_COMMIT=$(git rev-parse HEAD)"
          test -f scripts/quality-scan.mjs
          grep -Fq "Match Lifecycle Guard" scripts/quality-scan.mjs
          grep -Fq "j90SaveReplacer" scripts/quality-scan.mjs
          grep -Fq "android:screenOrientation=\"portrait\"" scripts/quality-scan.mjs
          ! grep -Fq "checkSyntax('Landscape Match'" scripts/quality-scan.mjs
          echo "QUALITY_SCANNER_SOURCE=FINAL_PORTRAIT_LIFECYCLE"

      - name: Varredura estrutural do projeto
        run: |
          echo "QUALITY_SCAN_COMMIT=$(git rev-parse HEAD)"
          npm run quality:scan

      - name: Gerar pacote offline de conteúdo
        run: npm run content:build

      - name: Validar tecnologia e garantir zero fotos de jogadores
        run: |
          test ! -d assets/j90-content/players
          test -d assets/j90-content/technology/animations
          test -s assets/j90-content/technology/animation-manifest.json
          test -s assets/j90-content/technology/ai/team-intelligence.json
          animation_bytes=$(du -sb assets/j90-content/technology/animations | awk '{print $1}')
          echo "ANIMATION_BYTES=$animation_bytes"
          test "$animation_bytes" -ge 20000000
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("assets/j90-content/content-manifest.json").read_text(encoding="utf-8"))
          tech=m.get("technology",{})
          assert int(tech.get("animationBytes",0)) >= 20000000
          assert int(tech.get("generatedBytes",0)) >= 64000000
          assert int(m.get("generatedBytes",0)) <= 180 * 1024 * 1024
          assert m.get("teamIntelligence")
          assert m.get("animationManifest")
          print("TECH_PACK_VALIDATED=OK")
          print("TEAM_INTELLIGENCE=OK")
          print("PLAYER_PHOTOS=DISABLED")
          PY

      - name: Validar pacote e runtime final
        run: npm run quality:scan

      - name: Gerar aplicação web a partir da fonte única
        run: npm run build

      - name: Validar bundle web e áudio runtime
        run: |
          set -euo pipefail
          test -s www/index.html
          test -s www/j90-manager-ai.js
          test -s www/j90-match-lifecycle.js
          test -s www/j90-auto-heal.js
          grep -Fq '<script src="j90-match-lifecycle.js"></script>' www/index.html
          grep -F -n '<script src="j90-manager-ai.js"></script>' www/index.html >/dev/null
          grep -F -n '<script src="j90-auto-heal.js"></script>' www/index.html >/dev/null
          test -s www/assets/j90-content/content-manifest.json
          test -d www/assets/j90-content/stadiums
          scene_files=$(find www/assets/j90-content/stadiums -type f -name '*.jpg' | wc -l)
          echo "WEB_SCENE_FILES=$scene_files"
          test "$scene_files" -ge 1

          # O runtime atual usa música instrumental CC0 remota + torcida/eventos CC0 de baixo volume.
          # O bundle Android continua sem arquivos de áudio importados.
          if find www/assets -type f \( -iname '*.mp3' -o -iname '*.wav' -o -iname '*.ogg' -o -iname '*.m4a' -o -iname '*.aac' \) -print -quit | grep -q .; then
            echo 'IMPORTED_AUDIO_FILES_DETECTED'
            find www/assets -type f \( -iname '*.mp3' -o -iname '*.wav' -o -iname '*.ogg' -o -iname '*.m4a' -o -iname '*.aac' \) -print
            exit 1
          fi

          if grep -R -n -E 'assets/audio|audio-import' www --exclude='*.map' --exclude='index.html'; then
            echo 'IMPORTED_AUDIO_PATH_REFERENCE_DETECTED'
            exit 1
          fi

          test -f www/j90-soundscape.js
          grep -F -n 'J90_AUDIO_MODE' www/j90-soundscape.js >/dev/null
          grep -F -n 'remote-cc0' www/j90-soundscape.js >/dev/null
          echo 'AUDIO_RUNTIME=VALIDATED'
          echo 'IMPORTED_AUDIO_FILES=0'

      - name: Teste real de inicialização e fluxo no Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.61.1
          npx playwright install --with-deps chromium
          nohup python3 -m http.server 4173 --directory www >/tmp/j90-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 1
          J90_SMOKE_URL=http://127.0.0.1:4173/ node scripts/browser-smoke.mjs
          J90_DIAG_URL=http://127.0.0.1:4173/diag.html node scripts/diag-smoke.mjs

      - name: Teste visual responsivo e anti-overflow
        run: |
          set -euo pipefail
          nohup python3 -m http.server 4173 --directory www >/tmp/j90-visual-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 1
          J90_SMOKE_URL=http://127.0.0.1:4173/ node scripts/visual-scan.mjs

      - name: Preparar Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Identificar o aplicativo como jogo no Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text(encoding="utf-8")
          app=re.search(r'<application\b[^>]*>',s)
          if not app:
              raise SystemExit("application tag not found in generated AndroidManifest.xml")
          tag=app.group(0)
          def set_attr(tag,name,value):
              pat=r'\sandroid:'+re.escape(name)+r'="[^"]*"'
              repl=' android:'+name+'="'+value+'"'
              if re.search(pat,tag):
                  return re.sub(pat,repl,tag)
              return tag[:-1]+repl+'>'
          tag=set_attr(tag,"appCategory","game")
          s=s[:app.start()]+tag+s[app.end():]

          activity=re.search(r'<activity\b[^>]+android:name="[^"]*MainActivity"[^>]*>',s)
          if not activity:
              activity=re.search(r'<activity\b[^>]+android:name="[^"]+\.MainActivity"[^>]*>',s)
          if not activity:
              raise SystemExit("MainActivity not found in generated AndroidManifest.xml")

          end=activity.end()
          main_close=s.find('</activity>',end)
          if main_close<0:
              raise SystemExit("MainActivity closing tag not found")

          block=s[activity.start():main_close]
          if 'android.intent.category.GAME' not in block:
              target='<category android:name="android.intent.category.GAME" />'
              launcher='''<category android:name="android.intent.category.LAUNCHER" />'''
              if launcher in block:
                  block=block.replace(launcher,launcher+'\n            '+target,1)
              else:
                  first_filter=re.search(r'<intent-filter\b[^>]*>([\s\S]*?)</intent-filter>',block)
                  if first_filter:
                      inside=first_filter.group(1)
                      block=block[:first_filter.start(1)]+inside+'\n            '+target+block[first_filter.end(1):]
                  else:
                      raise SystemExit("MainActivity launcher intent-filter not found")
              s=s[:activity.start()]+block+s[main_close:]

          p.write_text(s,encoding="utf-8")
          assert 'android:appCategory="game"' in s
          assert 'android.intent.category.GAME' in s
          print("ANDROID_GAME_CLASSIFICATION=OK")
          PY

      - name: Fixar orientação retrato e impedir recriação da Activity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text(encoding="utf-8")
          activity=re.search(r'<activity\b[^>]+android:name="[^"]*MainActivity"[^>]*>',s)
          if not activity:
              activity=re.search(r'<activity\b[^>]+android:name="[^"]+\.MainActivity"[^>]*>',s)
          if not activity:
              raise SystemExit("MainActivity not found in generated AndroidManifest.xml")
          tag=activity.group(0)
          def set_attr(tag,name,value):
              pat=r'\sandroid:'+re.escape(name)+r'="[^"]*"'
              repl=' android:'+name+'="'+value+'"'
              return re.sub(pat,repl,tag) if re.search(pat,tag) else tag[:-1]+repl+'>'
          tag=set_attr(tag,"screenOrientation","portrait")
          tag=set_attr(tag,"configChanges","orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout")
          s=s[:activity.start()]+tag+s[activity.end():]
          p.write_text(s,encoding="utf-8")
          assert 'android:screenOrientation="portrait"' in s
          assert 'android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"' in s
          forbidden_orientation = "full" + "Sensor"
          assert ('android:screenOrientation="' + forbidden_orientation + '"') not in s
          print("ANDROID_PORTRAIT_LOCK=OK")
          PY

      - name: Conferir conteúdo copiado para Android
        run: |
          src="www/assets/j90-content"
          dst="android/app/src/main/assets/public/assets/j90-content"
          test -d "$src"
          test -d "$dst"
          src_bytes=$(du -sb "$src" | awk '{print $1}')
          dst_bytes=$(du -sb "$dst" | awk '{print $1}')
          src_files=$(find "$src" -type f | wc -l)
          dst_files=$(find "$dst" -type f | wc -l)
          echo "CONTENT_SOURCE_BYTES=$src_bytes"
          echo "CONTENT_ANDROID_BYTES=$dst_bytes"
          echo "CONTENT_SOURCE_FILES=$src_files"
          echo "CONTENT_ANDROID_FILES=$dst_files"
          test "$src_bytes" -eq "$dst_bytes"
          test "$src_files" -eq "$dst_files"
          test -s "$dst/content-manifest.json"

      - name: Garantir retorno tátil Android
        working-directory: android
        run: |
          manifest="app/src/main/AndroidManifest.xml"
          grep -q 'android.permission.VIBRATE' "$manifest" || sed -i '/<manifest/a\    <uses-permission android:name="android.permission.VIBRATE" />' "$manifest"

      - name: Corrigir compatibilidade dos plugins Capacitor 7
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ("J90HapticsPlugin.java", "J90DisplayRatePlugin.java"):
              p = Path("android-overrides") / name
              s = p.read_text(encoding="utf-8")
              s = s.replace("import com.getcapacitor.annotation.PluginMethod;", "import com.getcapacitor.PluginMethod;")
              p.write_text(s, encoding="utf-8")
              assert "import com.getcapacitor.PluginMethod;" in s, name
          PY

      - name: Aplicar controle nativo de taxa de atualização
        run: |
          mkdir -p android/app/src/main/java/com/jornada90/manager
          cp android-overrides/MainActivity.java android/app/src/main/java/com/jornada90/manager/MainActivity.java
          cp android-overrides/J90DisplayRatePlugin.java android/app/src/main/java/com/jornada90/manager/J90DisplayRatePlugin.java
          cp android-overrides/J90HapticsPlugin.java android/app/src/main/java/com/jornada90/manager/J90HapticsPlugin.java
          cp android-overrides/J90ExternalBrowserPlugin.java android/app/src/main/java/com/jornada90/manager/J90ExternalBrowserPlugin.java
          test -s android/app/src/main/java/com/jornada90/manager/J90ExternalBrowserPlugin.java
          grep -Fq 'registerPlugin(J90ExternalBrowserPlugin.class);' android/app/src/main/java/com/jornada90/manager/MainActivity.java

      - name: Instalar conversor SVG
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Aplicar identidade e ícone Jornada 90 Manager
        working-directory: android
        run: |
          src="../assets/icon.svg"
          mkdir -p app/src/main/res/drawable-nodpi app/src/main/res/mipmap-anydpi-v26 app/src/main/res/values
          declare -A sizes=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          for density in "${!sizes[@]}"; do
            out="app/src/main/res/mipmap-$density"
            mkdir -p "$out"
            rsvg-convert -w "${sizes[$density]}" -h "${sizes[$density]}" -o "$out/ic_launcher.png" "$src"
            cp "$out/ic_launcher.png" "$out/ic_launcher_round.png"
          done
          rsvg-convert -w 1024 -h 1024 -o app/src/main/res/drawable-nodpi/j90_icon.png "$src"
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/j90_icon_background" />
            <foreground android:drawable="@drawable/j90_icon" />
            <monochrome android:drawable="@drawable/j90_icon" />
          </adaptive-icon>
          XML
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          cat > app/src/main/res/values/j90_icon_colors.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <color name="j90_icon_background">#0B1822</color>
          </resources>
          XML

      - name: Gerar APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renomear APK
        working-directory: android
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Jornada-90-Manager.apk

      - name: Auditoria pesada do APK e integridade da instalação
        working-directory: android
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/Jornada-90-Manager.apk"
          bytes=$(stat -c%s "$apk")
          mib=$(awk -v b="$bytes" 'BEGIN{printf "%.2f", b/1048576}')
          echo "APK_SIZE_BYTES=$bytes"
          echo "APK_SIZE_MIB=$mib"
          test "$bytes" -ge "$((60*1024*1024))

          # 1) O APK é um ZIP íntegro e todos os CRCs precisam bater.
          unzip -t "$apk" >/tmp/j90-unzip-test.txt

          # 2) Estrutura mínima obrigatória de um APK.
          unzip -l "$apk" | grep -q 'AndroidManifest.xml'
          unzip -l "$apk" | grep -q 'resources.arsc'
          unzip -l "$apk" | grep -q 'classes.dex'
          unzip -l "$apk" | grep -q 'j90-content/content-manifest.json'
          ! unzip -l "$apk" | grep -q 'j90-content/players/'

          # 3) Alinhamento, assinatura e manifesto são validados com o SDK Android.
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          test -n "$build_tools"
          "$build_tools/zipalign" -c -v 4 "$apk" >/tmp/j90-zipalign.txt
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" >/tmp/j90-apksigner.txt
          "$build_tools/aapt2" dump badging "$apk" >/tmp/j90-badging.txt
          grep -q "package: name='com.jornada90.manager'" /tmp/j90-badging.txt
          grep -q "application-label:'Jornada 90 Manager'" /tmp/j90-badging.txt

          # 4) Digesto da build, usado para detectar truncamento/corrupção após o download.
          sha256sum "$apk" | tee Jornada-90-Manager.apk.sha256
          {
            echo "APK=Jornada-90-Manager.apk"
            echo "SIZE_BYTES=$bytes"
            echo "SIZE_MIB=$mib"
            echo "SHA256=$(cut -d' ' -f1 Jornada-90-Manager.apk.sha256)"
            echo "RUN=${GITHUB_RUN_NUMBER}"
            echo "COMMIT=${GITHUB_SHA}"
          } | tee Jornada-90-Manager-release.txt

          test "$bytes" -lt "$((300*1024*1024))"
          echo "APK_UNDER_300_MIB=OK"
          echo "APK_FORENSICS=OK"
          echo "ZIP_INTEGRITY=OK"
          echo "ZIPALIGN=OK"
          echo "SIGNATURE=OK"
          echo "MANIFEST=OK"
          echo "SHA256_READY=OK"

      - name: Publicar APK bruto em Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/Jornada-90-Manager.apk"
          sha_file="android/Jornada-90-Manager.apk.sha256"
          info_file="android/Jornada-90-Manager-release.txt"
          bytes=$(stat -c%s "$apk")
          local_sha=$(cut -d' ' -f1 "$sha_file")
          tag="jornada-90-build-${GITHUB_RUN_NUMBER}"

          # Cria a Release diretamente pela API REST para evitar a referência
          # 'untagged' observada com gh release create nesta execução.
          payload=$(jq -n \
            --arg tag "$tag" \
            --arg target "$GITHUB_SHA" \
            --arg name "Jornada 90 Manager build ${GITHUB_RUN_NUMBER}" \
            --arg body "Build validada automaticamente. O APK foi auditado e terá tamanho/SHA-256 conferidos após o upload." \
            '{tag_name:$tag,target_commitish:$target,name:$name,body:$body,draft:true,prerelease:false}')
          release_json=$(curl --fail --show-error --silent --location --http1.1 --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases")
          release_id=$(printf '%s' "$release_json" | jq -r '.id // empty')
          upload_url=$(printf '%s' "$release_json" | jq -r '.upload_url // empty' | sed 's/{.*//')
          test -n "$release_id"
          test -n "$upload_url"
          echo "RELEASE_ID=${release_id}"
          echo "RELEASE_TAG=${tag}"

          # Upload via GitHub CLI para arquivos grandes.
          # Evita curl --data-binary, que pode carregar o APK inteiro na RAM.
          gh release upload "${tag}" "${apk}" "${sha_file}" "${info_file}" --clobber --repo "${GITHUB_REPOSITORY}"

          # Conferência autoritativa do asset recebido pelo GitHub.
          assets_json=$(curl --fail --show-error --silent --location --http1.1 --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}")
          remote_size=$(printf '%s' "$assets_json" | jq -r '.assets[] | select(.name=="Jornada-90-Manager.apk") | .size')
          remote_digest=$(printf '%s' "$assets_json" | jq -r '.assets[] | select(.name=="Jornada-90-Manager.apk") | .digest')
          remote_state=$(printf '%s' "$assets_json" | jq -r '.assets[] | select(.name=="Jornada-90-Manager.apk") | .state')
          test "$remote_state" = "uploaded"
          test "$remote_size" -eq "$bytes"
          test "$remote_digest" = "sha256:${local_sha}"
          echo "RELEASE_APK_STATE=uploaded"
          echo "RELEASE_APK_SIZE_MATCH=OK"
          echo "RELEASE_APK_SHA256_MATCH=OK"

          # Teste real do download público: baixa o mesmo asset pela URL final,
          # confere tamanho/SHA-256 e executa teste de CRC do APK baixado.
          download_url=$(printf '%s' "$assets_json" | jq -r '.assets[] | select(.name=="Jornada-90-Manager.apk") | .browser_download_url')
          test -n "$download_url"
          curl --fail --show-error --silent --location --http1.1 --retry 5 --retry-all-errors             -o /tmp/Jornada-90-Manager-downloaded.apk "$download_url"
          downloaded_size=$(stat -c%s /tmp/Jornada-90-Manager-downloaded.apk)
          downloaded_sha=$(sha256sum /tmp/Jornada-90-Manager-downloaded.apk | cut -d' ' -f1)
          test "$downloaded_size" -eq "$bytes"
          test "$downloaded_sha" = "$local_sha"
          unzip -t /tmp/Jornada-90-Manager-downloaded.apk >/tmp/j90-release-download-crc.txt
          echo "RELEASE_DOWNLOAD_SIZE_MATCH=OK"
          echo "RELEASE_DOWNLOAD_SHA256_MATCH=OK"
          echo "RELEASE_DOWNLOAD_CRC=OK"

          # Só depois da conferência a Release deixa de ser rascunho e vira a
          # versão pública/última.
          publish_payload='{"draft":false,"prerelease":false,"make_latest":true}'
          curl --fail --show-error --silent --location --http1.1 --retry 5 --retry-all-errors \
            -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -H "Content-Type: application/json" \
            --data "$publish_payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}" >/dev/null
          echo "RELEASE_PUBLISHED=OK"

      # Disponibiliza o instalável também no Artifacts. O download do
      # artifact é um ZIP externo do GitHub Actions, então o APK precisa ser
      # extraído antes da instalação. A Release continua sendo a opção
      # preferencial para baixar o .apk diretamente.
      - name: Publicar APK + integridade como artefato
        uses: actions/upload-artifact@v7
        with:
          name: jornada-90-manager-apk
          path: |
            android/Jornada-90-Manager.apk
            android/Jornada-90-Manager.apk.sha256
            android/Jornada-90-Manager-release.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

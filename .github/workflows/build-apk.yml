name: Build APK Jornada 90 Manager
# Continuous asset-based soundscape build
# Roster and soundscape validation build

concurrency:
  group: jornada90-apk-build
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'scripts/build.mjs'
      - 'scripts/sync-rosters.mjs'
      - 'src/**'
      - 'scripts/generate-content-pack.py'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'android-overrides/**'
      - 'assets/**'
      - 'data/**'
      - 'audio-import/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependências
        run: npm install

      - name: Preparar ferramentas de conteúdo e áudio
        run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-pil

      - name: Importar e converter áudios reais
        run: npm run audio:import

      - name: Sincronizar elencos reais dos times
        run: npm run data:rosters

      - name: Varredura estrutural do projeto
        run: npm run quality:scan

      - name: Gerar pacote offline de conteúdo
        run: npm run content:build

      - name: Validar pacote e runtime final
        run: npm run quality:scan

      - name: Gerar aplicação web a partir da fonte única
        run: npm run build

      - name: Validar bundle web e áudios reais
        run: |
          test -s www/assets/j90-content/content-manifest.json
          test -d www/assets/j90-content/stadiums
          scene_files=$(find www/assets/j90-content/stadiums -type f -name '*.jpg' | wc -l)
          echo "WEB_SCENE_FILES=$scene_files"
          test "$scene_files" -ge 1
          npm run audio:validate

      - name: Preparar Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Conferir conteúdo copiado para Android
        run: |
          src="www/assets/j90-content"
          dst="android/app/src/main/assets/public/assets/j90-content"
          test -d "$src"
          test -d "$dst"
          src_bytes=$(du -sb "$src" | awk '{print $1}')
          dst_bytes=$(du -sb "$dst" | awk '{print $1}')
          src_files=$(find "$src" -type f | wc -l)
          dst_files=$(find "$dst" -type f | wc -l)
          echo "CONTENT_SOURCE_BYTES=$src_bytes"
          echo "CONTENT_ANDROID_BYTES=$dst_bytes"
          echo "CONTENT_SOURCE_FILES=$src_files"
          echo "CONTENT_ANDROID_FILES=$dst_files"
          test "$src_bytes" -eq "$dst_bytes"
          test "$src_files" -eq "$dst_files"
          test -s "$dst/content-manifest.json"

      - name: Garantir retorno tátil Android
        working-directory: android
        run: |
          manifest="app/src/main/AndroidManifest.xml"
          grep -q 'android.permission.VIBRATE' "$manifest" || sed -i '/<manifest/a\    <uses-permission android:name="android.permission.VIBRATE" />' "$manifest"

      - name: Aplicar controle nativo de taxa de atualização
        run: |
          mkdir -p android/app/src/main/java/com/jornada90/manager
          cp android-overrides/MainActivity.java android/app/src/main/java/com/jornada90/manager/MainActivity.java
          cp android-overrides/J90DisplayRatePlugin.java android/app/src/main/java/com/jornada90/manager/J90DisplayRatePlugin.java
          cp android-overrides/J90HapticsPlugin.java android/app/src/main/java/com/jornada90/manager/J90HapticsPlugin.java

      - name: Instalar conversor SVG
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Aplicar identidade e ícone Jornada 90 Manager
        working-directory: android
        run: |
          src="../assets/icon.svg"
          mkdir -p app/src/main/res/drawable-nodpi app/src/main/res/mipmap-anydpi-v26 app/src/main/res/values
          declare -A sizes=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          for density in "${!sizes[@]}"; do
            out="app/src/main/res/mipmap-$density"
            mkdir -p "$out"
            rsvg-convert -w "${sizes[$density]}" -h "${sizes[$density]}" -o "$out/ic_launcher.png" "$src"
            cp "$out/ic_launcher.png" "$out/ic_launcher_round.png"
          done
          rsvg-convert -w 1024 -h 1024 -o app/src/main/res/drawable-nodpi/j90_icon.png "$src"
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/j90_icon_background" />
            <foreground android:drawable="@drawable/j90_icon" />
            <monochrome android:drawable="@drawable/j90_icon" />
          </adaptive-icon>
          XML
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          cat > app/src/main/res/values/j90_icon_colors.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <color name="j90_icon_background">#0B1822</color>
          </resources>
          XML

      - name: Gerar APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renomear APK
        working-directory: android
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Jornada-90-Manager.apk

      - name: Verificar tamanho mínimo do APK
        working-directory: android
        run: |
          apk="app/build/outputs/apk/debug/Jornada-90-Manager.apk"
          bytes=$(stat -c%s "$apk")
          mib=$(awk -v b="$bytes" 'BEGIN{printf "%.2f", b/1048576}')
          echo "APK_SIZE_BYTES=$bytes"
          echo "APK_SIZE_MIB=$mib"
          test "$bytes" -ge "$((1024*1024*1024))"
          unzip -t "$apk" >/dev/null
          unzip -l "$apk" | grep -q 'j90-content/content-manifest.json'

      - name: Publicar APK
        uses: actions/upload-artifact@v7
        with:
          name: jornada-90-manager-apk
          path: android/app/build/outputs/apk/debug/Jornada-90-Manager.apk
          if-no-files-found: error

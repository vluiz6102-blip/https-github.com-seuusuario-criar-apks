name: Build APK Carreira FC

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'www/index.html'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v5
      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependências
        run: npm install
      - name: Preparar Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
      - name: Garantir retorno tátil Android
        working-directory: android
        run: |
          manifest="app/src/main/AndroidManifest.xml"
          grep -q 'android.permission.VIBRATE' "$manifest" || sed -i '/<manifest/a\    <uses-permission android:name="android.permission.VIBRATE" />' "$manifest"
      - name: Aplicar controle nativo de taxa de atualização
        run: |
          mkdir -p android/app/src/main/java/com/jornada90/carreira
          cp android-overrides/MainActivity.java android/app/src/main/java/com/jornada90/carreira/MainActivity.java
          cp android-overrides/J90DisplayRatePlugin.java android/app/src/main/java/com/jornada90/carreira/J90DisplayRatePlugin.java
          cp android-overrides/J90HapticsPlugin.java android/app/src/main/java/com/jornada90/carreira/J90HapticsPlugin.java

      - name: Instalar conversor SVG
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Aplicar identidade e ícone Jornada 90
        working-directory: android
        run: |
          src="../assets/icon.svg"
          mkdir -p app/src/main/res/drawable-nodpi app/src/main/res/mipmap-anydpi-v26 app/src/main/res/values
          declare -A sizes=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          for density in "${!sizes[@]}"; do
            out="app/src/main/res/mipmap-$density"
            mkdir -p "$out"
            rsvg-convert -w "${sizes[$density]}" -h "${sizes[$density]}" -o "$out/ic_launcher.png" "$src"
            cp "$out/ic_launcher.png" "$out/ic_launcher_round.png"
          done
          rsvg-convert -w 1024 -h 1024 -o app/src/main/res/drawable-nodpi/j90_icon.png "$src"
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/j90_icon_background" />
            <foreground android:drawable="@drawable/j90_icon" />
            <monochrome android:drawable="@drawable/j90_icon" />
          </adaptive-icon>
          XML
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          cat > app/src/main/res/values/j90_icon_colors.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <color name="j90_icon_background">#0B1822</color>
          </resources>
          XML
      - name: Gerar APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Renomear APK
        working-directory: android
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Jornada-90.apk
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: jornada-90-apk
          path: android/app/build/outputs/apk/debug/Jornada-90.apk
          if-no-files-found: error

name: Jornada 90 Android APK

on:
  push:
    branches:
      - goal/open-source-replacement
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jornada90-mobile-apk
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Jornada 90 and the original game source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: game-source/web/package-lock.json

      - name: Set up Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Test original match and season engine
        working-directory: game-source
        run: cargo test --workspace

      - name: Build WebAssembly match engine
        working-directory: game-source
        run: wasm-pack build wasm --target web --out-dir ../web/src/wasm

      - name: Install web dependencies
        working-directory: game-source/web
        run: npm ci

      - name: Run original web and career tests before branding
        working-directory: game-source/web
        run: npm run test:run

      - name: Apply only Jornada 90 name and visible credits
        run: python3 scripts/prepare-mobile-brand.py

      - name: Build the mobile-first web app
        working-directory: game-source/web
        run: npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Capacitor Android wrapper
        working-directory: game-source/web
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock \
            @capacitor/core@7.4.3 \
            @capacitor/cli@7.4.3 \
            @capacitor/android@7.4.3
          cp ../../capacitor.config.ts ./capacitor.config.ts
          npx cap add android
          npx cap sync android

      - name: Build and verify the APK
        working-directory: game-source/web
        run: |
          set -euo pipefail
          cd android
          ./gradlew --no-daemon assembleDebug
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/Jornada90-Android-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jornada90-Android-debug
          path: Jornada90-Android-debug.apk
          if-no-files-found: error
          retention-days: 14

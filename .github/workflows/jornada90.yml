name: Jornada 90 - testes, build web e APK Android

on:
  push:
    branches: [jornada90-original]
  pull_request:
    branches: [jornada90-original]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jornada90-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Testar motor de partidas
        run: npm test

      - name: Compilar aplicação web
        run: npm run build

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Localizar Android SDK do runner
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Instalar plataforma Android e aceitar licenças
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$ANDROID_SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Criar projeto Android Capacitor
        run: |
          if [[ ! -d android ]]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Gerar APK debug
        run: ./android/gradlew -p android --no-daemon assembleDebug

      - name: Verificar APK, assinatura, alinhamento e checksum
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$apk"
          test -x "$tools/zipalign"
          test -x "$tools/apksigner"
          test -x "$tools/aapt"

          "$tools/zipalign" -c -v 4 "$apk"
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/jornada90-apk-badging.txt"
          grep -q "^package: name='com.victorluiz.jornada90'" "$RUNNER_TEMP/jornada90-apk-badging.txt"
          unzip -t "$apk" > "$RUNNER_TEMP/jornada90-apk-integrity.txt"

          mkdir -p artifacts
          cp "$apk" artifacts/Jornada-90-Manager-debug.apk
          (cd artifacts && sha256sum Jornada-90-Manager-debug.apk > Jornada-90-Manager-debug.apk.sha256)
          (cd artifacts && sha256sum --check Jornada-90-Manager-debug.apk.sha256)
          echo "APK_SIGNATURE_VALID=YES"
          echo "APK_ZIPALIGN_VALID=YES"
          echo "APK_ARCHIVE_VALID=YES"
          echo "APK_PACKAGE_ID=com.victorluiz.jornada90"
          stat -c "APK_SIZE_BYTES=%s" artifacts/Jornada-90-Manager-debug.apk

      - name: Publicar APK e checksum
        uses: actions/upload-artifact@v7
        with:
          name: jornada-90-manager-apk
          path: |
            artifacts/Jornada-90-Manager-debug.apk
            artifacts/Jornada-90-Manager-debug.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

name: Jornada 90 Android APK

on:
  push:
    branches:
      - goal/open-source-replacement
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jornada90-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Prepare and export Android APK
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout replacement branch and pinned game source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.1" >> "$GITHUB_PATH"

      - name: Install Godot 4.6.2 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.2
          use-dotnet: false
          include-templates: true

      - name: Configure Godot SDK and debug-signing paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Replace restricted dataset and prepare APK identity
        run: python3 scripts/prepare_game.py game

      - name: Import and validate Godot project
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          godot --headless --editor --path game --import --quit

      - name: Export APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p game/build dist
          godot --headless --path game --install-android-build-template --export-debug "Android" build/Jornada90.apk
          test -s game/build/Jornada90.apk
          file game/build/Jornada90.apk
          sha256sum game/build/Jornada90.apk | tee dist/SHA256SUMS.txt
          cp game/build/Jornada90.apk dist/Jornada90.apk
          cp game/LICENSE dist/LICENSE-OpenComputerFutbolSimulator-MIT.txt
          cp THIRD_PARTY_NOTICES.md dist/
          (cd dist && zip -q Jornada90-Android.zip \
            Jornada90.apk \
            LICENSE-OpenComputerFutbolSimulator-MIT.txt \
            THIRD_PARTY_NOTICES.md SHA256SUMS.txt)

      - name: Upload APK and legal notices
        uses: actions/upload-artifact@v4
        with:
          name: jornada90-android
          if-no-files-found: error
          path: |
            game/build/Jornada90.apk
            dist/Jornada90-Android.zip
            dist/THIRD_PARTY_NOTICES.md
            dist/SHA256SUMS.txt
          retention-days: 14

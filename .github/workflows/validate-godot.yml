name: Validate Godot Jornada 90

on:
  workflow_dispatch:
  push:
    paths:
      - 'godot/**'
      - '.github/workflows/validate-godot.yml'

concurrency:
  group: jornada90-godot-validate
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Godot 4.7.2
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64

      - name: Static runtime ownership audit
        run: |
          set -euo pipefail
          forbidden=(
            godot/scripts/audio_manager.gd
            godot/scripts/asset_streamer.gd
            godot/scripts/match_tactics_ai.gd
            godot/scripts/transfer_market_ai.gd
            godot/scripts/match_event_manager.gd
            godot/scripts/monetization_manager.gd
          )
          for file in "\${forbidden[@]}"; do
            if grep -nE 'func _process\\(|func _physics_process\\(' "$file"; then
              echo "Runtime ownership violation: $file"
              exit 1
            fi
          done

          test ! -f src/j90-landscape.js
          grep -Fq 'handheld/orientation=1' godot/project.godot
          grep -Fq 'stretch/scale_mode="integer"' godot/project.godot
          grep -Fq 'rendering/rendering_device/fallback_to_opengl3=true' godot/project.godot

      - name: Parse and load every Godot class
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless \
            --path godot \
            --script res://tests/architecture_smoke.gd

name: Open-source football manager validation and Android build

on:
  push:
    branches:
      - rebuild/open-source-game
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install manager dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate club database and squad references
        run: npm run validate:club-world

      - name: Build manager frontend
        run: npm run build

      - name: Test manager logic and UI
        run: npm test

      - name: Package and smoke-check the copied 2D match engine
        run: |
          node integration/package-soccer-js.mjs
          test -s dist/open-source-games/soccer-js/build/app.bundle.js
          test -s dist/open-source-games/soccer-js/build/app.css
          node --check integration/package-soccer-js.mjs
          node --check integration/j90-open-source-launcher.js

      - name: Configure Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure the runner's preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Test career, transfer, save, and match simulation logic
        working-directory: src-tauri
        run: cargo test -p domain -p engine -p ofm_core -p db

      - name: Validate bundled club package with the Rust package loader
        working-directory: src-tauri
        run: cargo run -p ofm-cli -- validate ../docs/modding/examples/maia-club-world-2026

      - name: Install Android platform and NDK
        run: |
          # The official setup action tries to install the deprecated "tools"
          # package on this runner, so use the runner's preinstalled sdkmanager.
          set +o pipefail
          yes | "$ANDROID_SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Initialize Tauri Android project
        run: npm run tauri -- android init --ci --skip-targets-install --config src-tauri/tauri.mobile.conf.json

      - name: Build ARM64 APK
        run: npm run tauri -- android build --apk --target aarch64 --ci --config src-tauri/tauri.mobile.conf.json

      - name: Align, sign, and verify installable APK
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          build_tools="$sdk/build-tools/35.0.0"
          unsigned_apk="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*unsigned.apk' -size +5M -print -quit)"
          test -n "$unsigned_apk"
          test -s "$unsigned_apk"
          test -x "$build_tools/zipalign"
          test -x "$build_tools/apksigner"
          test -x "$build_tools/aapt"

          mkdir -p artifacts
          aligned="$RUNNER_TEMP/Openfoot-Manager-arm64-aligned.apk"
          "$build_tools/zipalign" -f -v 4 "$unsigned_apk" "$aligned"

          # A sideloaded APK must be signed. Use a throwaway debug certificate
          # for CI artifacts; production store releases should use a private release key.
          key="$RUNNER_TEMP/openfoot-ci-debug.keystore"
          keytool -genkeypair -noprompt -keystore "$key" -storepass android \
            -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000

          "$build_tools/apksigner" sign --ks "$key" --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --out artifacts/Openfoot-Manager-arm64.apk "$aligned"
          "$build_tools/zipalign" -c -v 4 artifacts/Openfoot-Manager-arm64.apk
          "$build_tools/apksigner" verify --verbose --print-certs artifacts/Openfoot-Manager-arm64.apk
          "$build_tools/aapt" dump badging artifacts/Openfoot-Manager-arm64.apk > "$RUNNER_TEMP/apk-badging.txt"
          grep -q '^package: name=' "$RUNNER_TEMP/apk-badging.txt"
          unzip -t artifacts/Openfoot-Manager-arm64.apk > "$RUNNER_TEMP/apk-integrity.txt"

          (cd artifacts && sha256sum Openfoot-Manager-arm64.apk > Openfoot-Manager-arm64.apk.sha256 && sha256sum --check Openfoot-Manager-arm64.apk.sha256)
          grep -q 'Verified using v2 scheme' <("$build_tools/apksigner" verify --verbose artifacts/Openfoot-Manager-arm64.apk 2>&1) || \
            grep -q 'Verified using v1 scheme' <("$build_tools/apksigner" verify --verbose artifacts/Openfoot-Manager-arm64.apk 2>&1)
          echo "APK_ARCHIVE_VALID=YES"
          echo "APK_SIGNATURE_VALID=YES"
          echo "APK_ZIPALIGN_VALID=YES"

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v7
        with:
          name: openfoot-manager-arm64-apk
          path: |
            artifacts/Openfoot-Manager-arm64.apk
            artifacts/Openfoot-Manager-arm64.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

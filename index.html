.ln{font-size:15px;padding:3px 0;border-bottom:1px solid var(--ln)}

.tag{display:inline-block;background:var(--rd);color:#fff;border-radius:6px;padding:1px 8px;font-size:13px}
.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--ln);font-size:15px}

@keyframes up{from{opacity:0;transform:translateY(12px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes grow{from{width:0}}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
@keyframes fl2{from{opacity:0;transform:translateX(-14px)}}
.card{animation:up .35s both}
.bar i{animation:grow .8s both}
.ovr{animation:pop .5s both}
.sc{animation:pop .5s .1s both}
.ln{animation:fl2 .4s both;animation-delay:calc(var(--i,0)*.45s + .3s)}
.ln.y{color:var(--am);font-weight:700;animation:fl2 .4s both,pop .5s both;animation-delay:calc(var(--i,0)*.45s + .3s)}
.btn{transition:transform .12s,border-color .12s}.btn:active{transform:scale(.97)}

.art{display:flex;justify-content:center;gap:18px;padding:14px;margin:-2px -2px 10px;border-radius:8px;background:linear-gradient(135deg,#1f6f4a,#17445f 70%,#3a2c63)}
.art span{font-size:44px;line-height:1;display:inline-block;animation:fl 2.6s ease-in-out infinite}
.art span:nth-child(2){animation-delay:.5s}.art span:nth-child(3){animation-delay:1s}
.chips{display:flex;gap:6px;margin-top:6px}
.chip{flex:1;background:var(--bg);border:1px solid var(--ln);color:var(--mu);padding:9px 4px;border-radius:8px;font-size:14px}
.chip.on{border-color:var(--am);color:var(--am);font-weight:700}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@keyframes fall{from{transform:translateY(-20px) rotate(0);opacity:1}to{transform:translateY(190px) rotate(320deg);opacity:0}}
@keyframes gain{0%{color:#6ee09a;transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes loss{0%{color:var(--rd);transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.card{position:relative;overflow:hidden}
.cf{position:absolute;left:0;right:0;top:0;height:0;pointer-events:none}
.cf span{position:absolute;top:0;left:var(--x);font-size:22px;animation:fall 1.9s var(--d) both}
.mny{display:inline-block}.mny.gain{animation:gain .9s both}.mny.loss{animation:loss .9s both}
.tag{animation:shake .5s 3}
.go{animation:pulse 2s infinite}
.btn{animation:up .3s both}
.still .card,.still .btn,.still .chip,.still .ovr,.still .sc,.still .ln{animation:none!important}
.pill{display:inline-block;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:2px 9px;font-size:13px;margin:0 4px 4px 0;color:var(--am)}
.tabs button{padding:7px 2px;font-size:12px}.tabs button span{display:block;font-size:18px;line-height:1.2}
.nt{border-color:var(--am)}.nt h2{color:var(--am);font-size:17px}
.chips.wr{flex-wrap:wrap;margin:0 0 10px}.chips.wr .chip{flex:1 1 30%}

/* Jornada 90: folhas em vento + interface viva, sem novo RAF */
/* Jornada 90: profundidade cinematográfica do estádio, somente CSS */
@keyframes j90CloudDepthA{0%,100%{transform:translate3d(-1.5%,0,0) scale(1.015)}50%{transform:translate3d(2.5%,1.2%,0) scale(1.035)}}
@keyframes j90CloudDepthB{0%,100%{transform:translate3d(2%,0,0) scale(1.02)}50%{transform:translate3d(-3%,.8%,0) scale(1.045)}}
@keyframes j90StandDepth{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-1px,0)}}
@keyframes j90PitchBreath{0%,100%{filter:brightness(1)}50%{filter:brightness(1.035)}}
.stadiumScene .cloudLayer i:nth-child(1){animation:j90CloudDepthA 28s ease-in-out infinite}
.stadiumScene .cloudLayer i:nth-child(2){animation:j90CloudDepthB 34s ease-in-out infinite}
.stadiumScene .cloudLayer i:nth-child(3){animation:j90CloudDepthA 39s ease-in-out infinite reverse}
.stadiumScene .stands{animation:j90StandDepth 7.5s ease-in-out infinite}
.stadiumScene .pitch{animation:j90PitchBreath 8s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.stadiumScene .cloudLayer i:nth-child(1),.stadiumScene .cloudLayer i:nth-child(2),.stadiumScene .cloudLayer i:nth-child(3),.stadiumScene .stands,.stadiumScene .pitch{animation:none!important}}

@keyframes j90LeafWindFar{
  0%{transform:translate3d(-12vw,-18vh,0) rotate(-18deg) scale(.72);opacity:0}
  12%{opacity:.28}
  50%{transform:translate3d(34vw,28vh,0) rotate(150deg) scale(.86);opacity:.24}
  100%{transform:translate3d(118vw,76vh,0) rotate(340deg) scale(.72);opacity:0}
}
@keyframes j90LeafWindNear{
  0%{transform:translate3d(-18vw,-8vh,0) rotate(-35deg) scale(.9);opacity:0}
  10%{opacity:.58}
  45%{transform:translate3d(28vw,18vh,0) rotate(125deg) scale(1.05);opacity:.7}
  72%{transform:translate3d(68vw,48vh,0) rotate(235deg) scale(.92);opacity:.52}
  100%{transform:translate3d(122vw,72vh,0) rotate(390deg) scale(.76);opacity:0}
}
@keyframes j90LeafCross{
  0%{transform:translate3d(112vw,-4vh,0) rotate(20deg) scale(.72);opacity:0}
  14%{opacity:.38}
  52%{transform:translate3d(46vw,22vh,0) rotate(190deg) scale(.9);opacity:.34}
  100%{transform:translate3d(-22vw,62vh,0) rotate(350deg) scale(.72);opacity:0}
}
@keyframes j90StadiumLightPass{
  0%,100%{transform:translateX(-24%) skewX(-8deg);opacity:.025}
  48%{opacity:.11}
  55%{transform:translateX(24%) skewX(8deg);opacity:.07}
}
@keyframes j90HeroBreath{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-2px)}
}
.stadiumScene .leaves i{
  width:9px;height:5px;
  background:linear-gradient(135deg,rgba(238,204,125,.82),rgba(160,112,62,.42));
  box-shadow:0 2px 8px rgba(0,0,0,.18);
  transform-origin:50% 50%;
}
.stadiumScene .leaves.far i{
  animation:j90LeafWindFar var(--t) cubic-bezier(.2,.65,.3,1) infinite;
  animation-delay:var(--d);
}
.stadiumScene .leaves.near i{
  width:13px;height:7px;
  background:linear-gradient(135deg,rgba(247,211,129,.9),rgba(170,115,58,.5));
  filter:blur(.15px);
  animation:j90LeafWindNear var(--t) cubic-bezier(.2,.62,.28,1) infinite;
  animation-delay:var(--d);
}
.stadiumScene .leaves.near i:nth-child(2n){animation-name:j90LeafCross}
.stadiumScene .leaves.near i:nth-child(3n){animation-duration:10.6s}
.stadiumScene .leaves.far i:nth-child(2n){animation-name:j90LeafCross}
.stadiumScene .lights:after{
  content:"";position:absolute;inset:-15% -30%;
  background:linear-gradient(104deg,transparent 42%,rgba(255,221,154,.12) 50%,transparent 58%);
  filter:blur(10px);
  animation:j90StadiumLightPass 8.5s ease-in-out infinite;
}
.j90-menu-active .menuHero .logoMark.big{
  animation:logoFloat 4.8s ease-in-out infinite;
}
.j90-menu-active .menuHero .brand{
  animation:j90HeroBreath 5.5s ease-in-out infinite;
}
@media(prefers-reduced-motion:reduce){
  .stadiumScene .leaves i,
  .stadiumScene .lights:after,
  .j90-menu-active .menuHero .logoMark.big,
  .j90-menu-active .menuHero .brand{animation:none!important}
}

/* J90 DESIGN LANGUAGE v1: linguagem visual única, orientada a jogo */
:root{
 --j90-bg:#000;--j90-surface:#090b0c;--j90-surface-2:#0e1214;--j90-line:#22282b;
 --j90-text:#f4f6f5;--j90-muted:#89928f;--j90-gold:#ffca3a;--j90-green:#42d77d;
 --j90-red:#ff5c5c;--j90-blue:#79b8ff;--j90-radius:14px;--j90-gap:10px;
 --j90-shadow:0 12px 30px rgba(0,0,0,.28);
}
body{font-family:Inter,Roboto,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--j90-text)}
h1,h2,h3,.brand,.ovr,.sc{font-family:Inter,Roboto,"Arial Narrow",system-ui,sans-serif}
h1,h2,h3{letter-spacing:-.2px}
.card,.createPanel,.offerCard,.audioCard,.menuBtn{border-radius:var(--j90-radius);border:1px solid var(--j90-line);box-shadow:var(--j90-shadow)}
.card{background:linear-gradient(180deg,var(--j90-surface-2),var(--j90-surface))}
.card:has(.btn.go){border-color:#263a2d}
.card.nt{border-left:3px solid var(--j90-gold);border-top-color:var(--j90-line)}
.mu,.btn span,.offerRole,.offerTier,.audioOption span:last-child{color:var(--j90-muted)}
.btn,.menuBtn,.chip,.tabs button,.themeOption,.audioOption,.backBtn,.offerCard{
 transition:transform .14s ease,border-color .14s ease,background-color .14s ease,box-shadow .14s ease,color .14s ease;
}
.btn,.menuBtn,.chip,.tabs button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn:focus-visible,.menuBtn:focus-visible,.chip:focus-visible,.tabs button:focus-visible,.themeOption:focus-visible,.audioOption:focus-visible,.backBtn:focus-visible,input:focus-visible,select:focus-visible{

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carreira FC</title>
<style>
:root{--bg:#0f1f2a;--pn:#172c3a;--ln:#27475b;--tx:#e9eef1;--mu:#8fa6b3;--gr:#3fae6a;--am:#f0b43c;--rd:#e0584f}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,sans-serif;padding:max(12px,env(safe-area-inset-top)) 12px max(16px,env(safe-area-inset-bottom))}
#app{max-width:520px;margin:0 auto}
h1,h2{font-family:"Arial Narrow",Impact,sans-serif;font-weight:700;letter-spacing:.2px}
h2{font-size:20px;margin-bottom:8px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:10px}
.head{display:flex;gap:12px;align-items:center}
.ovr{font:700 54px/1 "Arial Narrow",Impact,sans-serif;color:var(--am);min-width:64px;text-align:center}
.ovr small{display:block;font:12px system-ui;color:var(--mu)}
.mu{color:var(--mu);font-size:14px}
.bar{margin-top:8px}.bar div{height:7px;background:var(--ln);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%}
.bar span{font-size:13px;color:var(--mu)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;background:none;border:1px solid var(--ln);color:var(--mu);padding:9px;border-radius:8px;font-size:15px}
.tabs button.on{background:var(--gr);border-color:var(--gr);color:#08170e;font-weight:700}
.btn{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--ln);color:var(--tx);padding:12px;border-radius:8px;margin-top:8px;font-size:16px}
.btn:active{border-color:var(--gr)}
.btn b{display:block}.btn span{color:var(--mu);font-size:14px}
.go{background:var(--gr);color:#08170e;border:0;text-align:center;font-weight:700}
input,select{width:100%;padding:12px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font-size:16px;margin:6px 0 12px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 3px;text-align:center;border-bottom:1px solid var(--ln)}
td:nth-child(2),th:nth-child(2){text-align:left}
tr.me td{color:var(--am);font-weight:700}
.sc{font:700 34px "Arial Narrow",Impact,sans-serif;text-align:center}
.ln{font-size:15px;padding:3px 0;border-bottom:1px solid var(--ln)}
.ln.y{color:var(--am);font-weight:700}.ln.o{color:var(--mu)}
.tag{display:inline-block;background:var(--rd);color:#fff;border-radius:6px;padding:1px 8px;font-size:13px}
.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--ln);font-size:15px}

@keyframes up{from{opacity:0;transform:translateY(12px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes grow{from{width:0}}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
@keyframes fl2{from{opacity:0;transform:translateX(-14px)}}
.card{animation:up .35s both}
.bar i{animation:grow .8s both}
.ovr{animation:pop .5s both}
.sc{animation:pop .5s .1s both}
.ln{animation:fl2 .4s both;animation-delay:calc(var(--i,0)*.45s + .3s)}
.ln.y{color:var(--am);font-weight:700;animation:fl2 .4s both,pop .5s both;animation-delay:calc(var(--i,0)*.45s + .3s)}
.btn{transition:transform .12s,border-color .12s}.btn:active{transform:scale(.97)}
.art{display:flex;justify-content:center;gap:18px;padding:14px;margin:-2px -2px 10px;border-radius:8px;background:linear-gradient(135deg,#1f6f4a,#17445f 70%,#3a2c63)}
.art span{font-size:44px;line-height:1;display:inline-block;animation:fl 2.6s ease-in-out infinite}
.art span:nth-child(2){animation-delay:.5s}.art span:nth-child(3){animation-delay:1s}
.chips{display:flex;gap:6px;margin-top:6px}
.chip{flex:1;background:var(--bg);border:1px solid var(--ln);color:var(--mu);padding:9px 4px;border-radius:8px;font-size:14px}
.chip.on{border-color:var(--am);color:var(--am);font-weight:700}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.wc{background:linear-gradient(135deg,#183b52,#26334f);border-color:#4c7692}.wc .round{color:var(--am);font-weight:700}.sound{font-size:12px;float:right;color:var(--mu)}

@keyframes fall{from{transform:translateY(-20px) rotate(0);opacity:1}to{transform:translateY(190px) rotate(320deg);opacity:0}}
@keyframes gain{0%{color:#6ee09a;transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes loss{0%{color:var(--rd);transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(63,174,106,.6)}50%{box-shadow:0 0 0 8px rgba(63,174,106,0)}}
.card{position:relative;overflow:hidden}
.cf{position:absolute;left:0;right:0;top:0;height:0;pointer-events:none}
.cf span{position:absolute;top:0;left:var(--x);font-size:22px;animation:fall 1.9s var(--d) both}
.mny{display:inline-block}.mny.gain{animation:gain .9s both}.mny.loss{animation:loss .9s both}
.tag{animation:shake .5s 3}
.go{animation:pulse 2s infinite}
.btn{animation:up .3s both}
.still *{animation:none!important}
 .pill{display:inline-block;border:1px solid var(--ln);border-radius:999px;padding:4px 8px;margin:3px;color:var(--mu)}
</style>
</head>

 S.hist.push({y:S.year,c:S.club.n,t:TIERS[S.club.tier],p:pos,g:S.ss.g,a:S.ss.a,j:S.ss.j,avg:avg.toFixed(1)});
 if(pos==1){S.titles++;S.tro.push({n:'Campeonato: '+TIERS[S.club.tier],y:S.year,c:S.club.n,p:'Brasil'});sfx('trophy');toast('🏆 CAMPEÃO!',S.club.n+' conquistou '+TIERS[S.club.tier])}
 ['tec','fis','men'].forEach(k=>{const a=S.age;let d=a<22?R(2,4.5):a<27?R(.5,2.5):a<31?R(-1,1):R(-3,.3);if(k=='fis'&&a>=29)d-=R(.5,1.5);if(k=='men'&&a>=27)d+=R(.5,1.5);S[k]=cl(S[k]+d,25,99)});
 S.age++;S.year++;S.inj=0;S.energy=100;S.yrs=Math.max(0,S.yrs-1);
 const sc=ovr()+(avg-6.5)*4+S.fame/10,of=[],pool=[],seen={},ex=[],y=S.year-1;
 if(S.ss.g>=12){ex.push('Você foi um dos artilheiros do campeonato.');S.fame=cl(S.fame+4)}
 if(y>=2026&&y%4==2&&ovr()>=68){ex.push('Você foi convocado para a Copa do Mundo.');S.wcPending=true;}
 if(avg>=8&&S.club.tier>=5&&S.fame>50){S.fame=cl(S.fame+10);ex.push('Você ficou entre os finalistas da Bola de Ouro.')}
 LG.forEach((l,t)=>l.c.forEach(x=>{const[n,s]=x.split(':');if(n!=S.club.n&&+s<=sc+(t==4&&S.age>=27?14:4)&&+s>=sc-22)pool.push({n,tier:t,s:+s})}));
 pool.sort(()=>Math.random()-.5).forEach(c=>{if(of.length<4&&!seen[c.tier]){seen[c.tier]=1;c.w=wg(c);of.push(c)}});
 of.sort((a,b)=>b.s-a.s);if(S.pre){of.length=Math.min(of.length,3);of.unshift(S.pre);S.pre=null}
 S.sum={pos,avg:avg.toFixed(1),g:S.ss.g,a:S.ss.a,j:S.ss.j,champ:pos==1,ex};if(S.wcPending){S.wcPending=false;startWC();return}S.offers=of;
 S.stayW=Math.max(S.wage,wg(S.club));
 S.phase=S.age>=38?'retired':'vac'
}
function stay(y){S.wage=Math.round(S.stayW*(y==4?1.12:1));S.yrs=y||2;join({n:S.club.n,tier:S.club.tier,s:S.club.s+RI(-3,3)});render()}
function go(i){const o=S.offers[i];S.wage=o.w;S.yrs=3;join({n:o.n,tier:o.tier,s:o.s});render()}
function keep(){join({n:S.club.n,tier:S.club.tier,s:S.club.s+RI(-3,3)});render()}
function retire(){S.phase='retired';render()}
function co(n){S.coach=cl(S.coach+n)}
function reset(){try{localStorage.removeItem('carreirafc2')}catch(e){}S=null;render()}
const bar=(l,v,c)=>`<div class="bar"><span>${l} ${Math.round(v)}</span><div><i style="width:${v}%;background:${c}"></i></div></div>`;
function head(){return`<div class="card"><div class="head"><div class="ovr">${ovr()}<small>geral</small></div><div><h1>${S.name}</h1><div class="mu">${POSN[S.pos]}, ${S.age} anos</div><div class="mu">${S.club.n} · ${TIERS[S.club.tier]}</div>${S.inj>0?'<span class="tag">Lesionado</span>':''}</div></div>${bar('Energia',S.energy,S.energy<35?'var(--rd)':'var(--gr)')}${bar('Moral',S.morale,'var(--am)')}${bar('Fama',S.fame,'#6fa8dc')}<div class="mu" style="margin-top:8px">Técnica ${Math.round(S.tec)} · Físico ${Math.round(S.fis)} · Mental ${Math.round(S.men)}</div><div class="row" style="margin-top:6px"><span>Saldo em conta</span><b class="mny ${S.lm==null||S.lm==S.money?'':S.money>S.lm?'gain':'loss'}">R$ ${fm(S.money)}</b></div></div>`}
const tabs=()=>`<div class="sound">🔊 <button class="chip" onclick="toggleSound()">Som: ${audioOK?'ON':'OFF'}</button></div><div class="tabs">${[['game','🎮','Jogo'],['tbl','📊','Tabela'],['ply','🧍','Jogador'],['news','📰','Notícias'],['car','📖','Carreira']].map(([k,i,l])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';render()">${i}<br><small>${l}</small></button>`).join('')}</div>`;
const playerPanel=()=>`<div class="card"><h2>${PLAYER_STYLE()}</h2><div class="mu">Técnico: <b>${Math.round(S.coach)}/100</b> · Valor: <b>R$ ${fm(mv())}</b></div>${AK.map(k=>bar(ATTR_NAMES[k],S.at[k],'var(--gr)')).join('')}</div><div class="card"><h2>Carreira</h2><div class="row"><span>Jogos</span><b>${S.tot.j}</b></div><div class="row"><span>Gols</span><b>${S.tot.g}</b></div><div class="row"><span>Assistências</span><b>${S.tot.a}</b></div><div class="row"><span>Títulos</span><b>${S.titles}</b></div></div>`;
const conf=e=>`<div class="cf">${Array.from({length:10},(_,i)=>`<span style="--x:${5+i*10}%;--d:${(i*.15).toFixed(2)}s">${e}</span>`).join('')}</div>`;
const art=a=>`<div class="art">${a.map(x=>`<span>${x}</span>`).join('')}</div>`;
function wcV(){const w=S.wc;if(w.done)return '<div class="card wc"><h2>🇧🇷 Copa do Mundo</h2><p>O torneio terminou.</p><button class="btn go" onclick="finishWC()">Continuar carreira</button></div>';if(S.wcQ){const l=w.last;return '<div class="card wc"><span class="round">'+l.stage+'</span><h2>🇧🇷 Brasil x '+l.opp+'</h2><div class="sc">'+l.my+' × '+l.og+'</div><p class="mu">A partida terminou. Você precisa decidir o lance decisivo.</p><button class="btn go" onclick="wcPenalty()">⚽ Assumir a cobrança decisiva</button><button class="btn" onclick="wcPenalty(true)">Deixar o capitão cobrar</button></div>'}return '<div class="card wc"><span class="round">'+w.stage+'</span><h2>🇧🇷 Brasil x '+w.opp[w.round]+'</h2><p>Você está na Copa. Cada partida será jogada individualmente, com uma decisão sua.</p><button class="btn" onclick="wcPlay(0)"><b>Atacar</b><span>Mais chances de gol, maior desgaste</span></button><button class="btn" onclick="wcPlay(1)"><b>Equilibrar</b><span>Controle e segurança</span></button><button class="btn" onclick="wcPlay(2)"><b>Jogar no contra-ataque</b><span>Menos posse, transições rápidas</span></button></div>'}
function gameV(){
 if(S.phase=='post'){const l=S.last;return`<div class="card">${l.g>0?conf('⚽'):''}${art(['🏟️',l.gh+l.ga>3?'🔥':'⚽'])}<div class="mu">Rodada ${S.r} de 18</div><div class="sc">${l.h} ${l.gh} x ${l.ga} ${l.a}</div>${l.lines.map((x,k)=>`<div class="ln ${x[1]}" style="--i:${k}">${x[0]}</div>`).join('')||'<div class="ln o">Jogo sem gols.</div>'}</div><div class="card"><h2>${l.min?'Sua atuação':'Você não jogou'}</h2><div class="mu">${l.min?`Nota ${l.rt.toFixed(1)} · ${l.min} min · ${l.g} gol(s) · ${l.as} assistência(s)`:S.inj?'Você está no departamento médico.':'O técnico preferiu outros jogadores.'}</div>${S.iv?`<p style="margin-top:10px">${S.iv}</p>`:`<p style="margin-top:10px">Entrevista depois do jogo:</p><div class="chips">${['Elogiar o time','Assumir a culpa','Provocar o rival'].map((t,k)=>`<button class="chip" onclick="itv(${k})">${t}</button>`).join('')}</div>`}<button class="btn go" onclick="next()">${S.r>=18?'Fechar a temporada':'Próxima rodada'}</button></div>`}
 if(S.ev!=null){const e=EV[S.ev];return`<div class="card">${art(e.a)}<h2>Acontece algo</h2><p>${e.t}</p>${e.o.map((o,i)=>`<button class="btn" onclick="pick(${i})"><b>${o[0]}</b><span>${o[1]}</span></button>`).join('')}</div>`}
 const rd=S.fx[S.r].find(p=>p[0]==S.me||p[1]==S.me),ij=S.inj>0,tc=S.tac||'bal';
 return`<div class="card"><h2>Rodada ${S.r+1} de 18</h2><p class="mu">Próximo jogo: ${S.teams[rd[0]].n} x ${S.teams[rd[1]].n}</p>${ij?`<button class="btn go" onclick="train('rest')">Recuperar no departamento médico<br><span>Faltam ${S.inj} rodada(s)</span></button>`:`<p style="margin-top:8px">Postura do time no jogo:</p><div class="chips">${[['atk','Atacar'],['bal','Equilibrar'],['def','Defender']].map(t=>`<button class="chip ${tc==t[0]?'on':''}" onclick="S.tac='${t[0]}';render(1)">${t[1]}</button>`).join('')}</div><p style="margin-top:10px">Como será o treino da semana?</p>${[['tec','Técnica','Passe, drible e finalização'],['fis','Físico','Força e resistência'],['men','Mental','Decisão e frieza'],['pos','Treino de posição','Reforça o que mais pesa na sua função'],['pers','Personal trainer','R$ 30 mil · ganho maior, cansa mais'],['rest','Descanso','Recupera energia e moral']].map(t=>`<button class="btn" onclick="train('${t[0]}')"><b>${t[1]}</b><span>${t[2]}</span></button>`).join('')}`}</div>`}
const vacV=()=>`<div class="card">${art(['🏖️','✈️'])}<h2>Férias</h2><p class="mu">Antes de ouvir propostas, como será a pausa?</p>${[['Descansar em casa','Energia cheia e +moral'],['Viajar com a família','-R$ 60 mil, +moral'],['Treinar nas férias','+técnica e físico, -moral'],['Fechar com patrocinadores','+R$ 100 mil, +fama']].map((o,i)=>`<button class="btn" onclick="vac(${i})"><b>${o[0]}</b><span>${o[1]}</span></button>`).join('')}</div>`;
function vac(k){if(k==0)mo(8);if(k==1){mn(-60);mo(12)}if(k==2){at('tec',.8);at('fis',.8);mo(-3)}if(k==3){mn(100);fa(3)}S.phase='end';render()}
const pk=(a,k)=>a[k%a.length];
function newsV(){
 const l=S.last,tm=S.club.n,nm=S.name,pos=order().indexOf(S.me)+1,tb=S.tbl[S.me],k=S.r+S.age;
 let m=['👋',nm+' chega com vontade de aparecer',`O jovem ${POSN[S.pos].toLowerCase()} de ${S.age} anos quer ganhar espaço no ${tm}.`],t=['📅',tm+' se prepara para a estreia',`A temporada da ${TIERS[S.club.tier]} está prestes a começar.`];
 if(l){
  const home=l.h==tm,my=home?l.gh:l.ga,op=home?l.ga:l.gh,rv=home?l.a:l.h,sc=`${l.h} ${l.gh} x ${l.ga} ${l.a}`;
  t=my>op?['📈',pk([`${tm} vence o ${rv} e embala`,`Vitória do ${tm} sobre o ${rv}`],k),`${sc}. O time soma ${pts(tb)} pontos e é o ${pos}º colocado.`]:my<op?['📉',pk([`${tm} perde para o ${rv} e a pressão aumenta`,`Derrota amarga do ${tm}`],k),`${sc}. A equipe está em ${pos}º lugar, com ${pts(tb)} pontos.`]:['⚖️',`${tm} empata com o ${rv}`,`${sc}. O time é o ${pos}º colocado, com ${pts(tb)} pontos.`];
  if(pos==1&&S.r>3)t=['🏆',`${tm} lidera a ${TIERS[S.club.tier]}`,`Com ${pts(tb)} pontos em ${S.r} rodadas, o time sonha com o título.`];
  const rt=l.rt?l.rt.toFixed(1):'';
  if(S.inj>0)m=['🩺',nm+' é desfalque no '+tm,`O departamento médico diz que ele precisa de mais ${S.inj} rodada(s) para voltar.`];
  else if(!l.min)m=['🪑',`${nm} fica fora do jogo contra o ${rv}`,'O técnico preferiu outras opções e o jogador espera uma chance.'];
  else if(l.g>=2)m=['🔥',`${nm} brilha e faz ${l.g} gols`,`Nota ${rt}: atuação de craque contra o ${rv}.`];
  else if(l.g==1)m=['⚽',`${nm} marca contra o ${rv}`,`Nota ${rt}. Ele soma ${S.ss.g} gol(s) na temporada.`];
  else if(l.as>0)m=['🅰️',nm+' dá passe decisivo',`Nota ${rt}. Ele soma ${S.ss.a} assistência(s) na temporada.`];
  else if(l.rt<5.5)m=['😬',nm+' vai mal e vira alvo da torcida',`Nota ${rt}. O jogador precisa reagir na próxima rodada.`];
  else if(S.fame>60)m=['📸',nm+' é o assunto do momento','Convites e propostas chegam de todos os lados.'];
  else m=['📋',`${nm} cumpre o papel contra o ${rv}`,`Nota ${rt} em ${l.min} minutos de jogo.`]
 }
 const c=(e,s)=>`<div class="card">${art([e[0]])}<div class="mu">${s}</div><h2>${e[1]}</h2><p>${e[2]}</p></div>`;
 return c(m,'Sobre você')+c(t,'Sobre o '+tm)
}
function tblV(){return`<div class="card"><h2>${TIERS[S.club.tier]}</h2><table><tr><th>#</th><th>Time</th><th>P</th><th>J</th><th>V</th><th>SG</th></tr>${order().map((i,k)=>{const t=S.tbl[i];return`<tr class="${i==S.me?'me':''}"><td>${k+1}</td><td>${S.teams[i].n}</td><td>${pts(t)}</td><td>${t.w+t.d+t.l}</td><td>${t.w}</td><td>${t.gf-t.ga}</td></tr>`}).join('')}</table></div>`}
function careerV(){return`<div class="card"><h2>Números da carreira</h2>${[['Jogos',S.tot.j],['Gols',S.tot.g],['Assistências',S.tot.a],['Títulos',S.titles],['Contrato',S.yrs+' ano(s) · R$ '+fm(S.wage)+'/mês'],['Patrimônio','R$ '+fm(S.money)]].map(r=>`<div class="row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div><div class="card"><h2>Temporadas</h2>${S.hist.map(h=>`<div class="row"><span>${h.y} ${h.c}<br><span class="mu">${h.t} · ${h.p}º lugar</span></span><span style="text-align:right">${h.g}G ${h.a}A<br><span class="mu">nota ${h.avg}</span></span></div>`).join('')||'<p class="mu">Nenhuma temporada completa ainda.</p>'}</div>`}
function endV(){const m=S.sum;return`<div class="card">${m.champ?conf('🎉'):''}${art([m.champ?'🏆':'📅','🎉'])}<h2>Fim da temporada ${S.year-1}</h2><p>${m.champ?'Seu time foi campeão!':'Seu time terminou em '+m.pos+'º lugar.'}</p>${m.ex.map(x=>`<p>${x}</p>`).join('')}<p class="mu">${m.j} jogos · ${m.g} gols · ${m.a} assistências · nota média ${m.avg}</p></div><div class="card">${art(['✈️','💼'])}<h2>Seu futuro</h2>${S.yrs>0?`<button class="btn" onclick="keep()"><b>Cumprir o contrato</b><span>Restam ${S.yrs} ano(s) · R$ ${fm(S.wage)}/mês</span></button>`:''}<button class="btn" onclick="stay(2)"><b>Ficar no ${S.club.n}</b><span>Renovar por 2 anos · R$ ${fm(S.stayW)}/mês</span></button><button class="btn" onclick="stay(4)"><b>Renovar por 4 anos</b><span>Salário 12% maior · R$ ${fm(Math.round(S.stayW*1.12))}/mês</span></button>${S.offers.map((o,i)=>`<button class="btn" onclick="go(${i})"><b>${o.n}</b><span>${o.pre?'Pré-contrato assinado · ':''}${TIERS[o.tier]} · 3 anos · R$ ${fm(o.w)}/mês</span></button>`).join('')}${S.age>=32?`<button class="btn" onclick="retire()"><b>Aposentar</b><span>Encerrar a carreira aos ${S.age} anos</span></button>`:''}</div>`}
function retV(){return`<div class="card"><h2>Fim de carreira</h2><p>${S.name} se aposentou aos ${S.age} anos.</p>${[['Jogos',S.tot.j],['Gols',S.tot.g],['Assistências',S.tot.a],['Títulos',S.titles],['Patrimônio','R$ '+fm(S.money)]].map(r=>`<div class="row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}<button class="btn go" onclick="reset()">Começar nova carreira</button></div>${careerV()}`}
function intro(){const o=a=>a.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');return`<div class="card">${art(['⚽','🏆','🌍'])}<h1 style="font-size:30px">Carreira FC</h1><p class="mu">Comece aos 17 anos na Série C e tente chegar à Europa ou fechar com a Arábia.</p><label>Nome do jogador<input id="nm" maxlength="20" placeholder="Seu nome"></label><label>Posição<select id="ps">${o(Object.keys(POSN).map(k=>[k,POSN[k]]))}</select></label><label>Ponto forte<select id="st">${o([['tec','Técnica'],['fis','Físico'],['men','Mental']])}</select></label><label>Clube de início<select id="cl">${o(LG[0].c.map(x=>[x.split(':')[0],x.split(':')[0]]))}</select></label><button class="btn go" onclick="start()">Começar carreira</button></div>`}
function save(){try{localStorage.setItem('carreirafc2',JSON.stringify(S))}catch(e){}}
function render(still){
 const A=$('app');A.className=still?'still':'';if(!S){A.innerHTML=intro();return}
 let h=head();
 if(S.phase=='retired')h=retV();else if(S.phase=='wc')h+=wcV();else if(S.phase=='vac')h+=vacV();else if(S.phase=='end')h+=endV();else h+=tabs()+(tab=='game'?gameV():tab=='tbl'?tblV():tab=='ply'?playerPanel():tab=='news'?newsV():careerV());
 A.innerHTML=h;S.lm=S.money;save();
 if(!still){window.scrollTo(0,0);if(document.querySelectorAll)document.querySelectorAll('.btn').forEach((b,i)=>b.style.animationDelay=i*.05+'s')}
}
try{S=JSON.parse(localStorage.getItem('carreirafc2'))}catch(e){S=null}
if(S){S.at=S.at||{};S.awards=S.awards||[];S.marketPeak=S.marketPeak||0;S.v=4}
if(S&&(!S.teams||!S.club||!S.fx||!S.tbl))S=null;
render();
</script>
</body>
